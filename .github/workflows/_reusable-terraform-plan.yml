name: Terraform plan (reusable)

# Encapsula el ciclo `terraform plan` de los repos *.Infraestructura del plane.
# Dos jobs:
#   - validate: gate de calidad SIN secretos ni Azure (fmt + init -backend=false +
#     validate). Corre en TODO PR, incluido Dependabot — GitHub no inyecta los
#     Actions secrets en runs de Dependabot, así que el plan autenticado no puede
#     correr ahí y se saltea; validate sí, porque no necesita secretos ni backend.
#   - plan: plan autenticado (OIDC + backend azurerm) que comenta el resultado en
#     el PR. Se saltea para PRs de Dependabot (`if: github.actor != 'dependabot[bot]'`).
# El backend se deriva del `bounded_context` y el `environment` por convención CAF
# (con overrides opcionales). El job declara `environment:` (GitHub Environment del
# repo CALLER), así que `vars`/`secrets` resuelven primero al Environment y caen a
# repo-level. Los TF_VAR_* comunes se leen de `vars`/`secrets` del CALLER; los
# por-BC (front_*) llegan como vars `TFVAR_*` del caller (org/repo/Environment,
# resueltas DENTRO del job → sí ven el Environment) o, legado, en
# `extra_tf_vars_json` (que el caller evalúa SIN Environment: repo/org vars
# solamente).

on:
  workflow_call:
    inputs:
      bounded_context:
        description: "Bounded context corto (cont|asis|impu|oxp). Deriva el backend y etiqueta el comentario."
        type: string
        required: true
      environment:
        description: |
          Ambiente objetivo (dev|prod, EN MINÚSCULAS: el valor crudo viaja al
          subject OIDC; otra caja falla temprano). Deriva el backend del state
          (dev → rg-tfstate-<bc>-eus2-001 / sttfstate<bc>eus2001 / <bc>-dev.tfstate;
          prod → rg-tfstate-<bc>-prod-eus2-001 / sttfstate<bc>prodeus2001 / <bc>-prod.tfstate),
          se declara como GitHub Environment en el job (vars/secrets por Environment)
          y se exporta como TF_VAR_environment.
        type: string
        required: false
        default: "dev"
      tf_version:
        description: "Versión de Terraform para setup-terraform."
        type: string
        required: false
        default: "1.9.8"
      working_directory:
        description: "Directorio de los archivos .tf."
        type: string
        required: false
        default: "infra"
      extra_tf_vars_json:
        description: |
          JSON object {"<tf_var>": "<valor>"} con TF_VARs adicionales NO sensibles
          (típicamente las `front_<bc>_*`). Cada entrada no vacía se exporta como
          TF_VAR_<key>. NUNCA poner secretos acá: los inputs no se enmascaran en logs.
          OJO: el caller evalúa este input SIN Environment (solo vars repo/org).
          Para TF_VARs con valor por ambiente, preferir la convención TFVAR_*:
          toda var `TFVAR_<NOMBRE>` del caller (org/repo/Environment, precedencia
          estándar de GitHub) se exporta como `TF_VAR_<nombre>` y GANA sobre este
          input.
        type: string
        required: false
        default: "{}"
      plan_lock_timeout:
        description: "Valor de -lock-timeout para `terraform plan`."
        type: string
        required: false
        default: "5m"
      comment_on_pr:
        description: "Si publica/actualiza el comentario con el resultado del plan en el PR."
        type: boolean
        required: false
        default: true
      comment_max_chars:
        description: "Límite de caracteres del comentario del plan (se trunca por encima)."
        type: number
        required: false
        default: 60000
      backend_resource_group:
        description: "Override del Resource Group del backend. Vacío → derivado de bounded_context + environment."
        type: string
        required: false
        default: ""
      backend_storage_account:
        description: "Override del Storage Account del backend. Vacío → derivado de bounded_context + environment."
        type: string
        required: false
        default: ""
      backend_container:
        description: "Container del backend del state."
        type: string
        required: false
        default: "tfstate"
      backend_key:
        description: "Override del key del state. Vacío → <bc>-<environment>.tfstate."
        type: string
        required: false
        default: ""
    secrets:
      VM_ADMIN_PASSWORD:
        description: "Contraseña del admin de la VM (→ TF_VAR_vm_admin_password)."
        required: false
      GH_RUNNER_PAT:
        description: "PAT del runner self-hosted (→ TF_VAR_github_runner_pat)."
        required: false
      SINCOERP_PASSWORD:
        description: "Password de integración SincoERP (→ TF_VAR_sincoerp_password). Usado por OXP y cont; vacío y omitido en los BCs que no integran con SincoERP."
        required: false
      FLAGSMITH_API_KEY:
        description: "API key de Flagsmith (→ TF_VAR_flagsmith_api_key). Usado por cont; vacío y omitido en los BCs que no usan Flagsmith."
        required: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform ${{ inputs.tf_version }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (sin backend)
        run: terraform init -input=false -backend=false

      - name: terraform validate
        run: terraform validate -no-color

  plan:
    name: terraform plan
    needs: validate
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # GitHub Environment del repo CALLER: habilita vars/secrets por Environment
    # (A9). Si el Environment no existe aún en el caller, GitHub lo crea al
    # correr y vars/secrets caen a repo-level (retrocompatible). El Environment
    # `dev` NO debe tener deployment branch policy (el plan corre en refs de PR).
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      # Auth Azure → Terraform azurerm provider y backend con OIDC.
      # vars.* resuelven al repo CALLER (Environment del job primero, luego repo).
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolver backend y exportar TF_VARs
        shell: bash
        env:
          BC: ${{ inputs.bounded_context }}
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_RG: ${{ inputs.backend_resource_group }}
          BACKEND_SA: ${{ inputs.backend_storage_account }}
          BACKEND_CONTAINER: ${{ inputs.backend_container }}
          BACKEND_KEY_OVERRIDE: ${{ inputs.backend_key }}
          EXTRA_TF_VARS_JSON: ${{ inputs.extra_tf_vars_json }}
          # TODAS las vars visibles al job (org + repo + Environment del caller,
          # ya resueltas por precedencia). De acá salen las TFVAR_*.
          ALL_VARS_JSON: ${{ toJSON(vars) }}
          # Comunes (vars/secrets del caller). Vacío → no se exporta el TF_VAR.
          V_OWNER: ${{ vars.OWNER }}
          V_COST_CENTER: ${{ vars.COST_CENTER }}
          V_SSH_IPS: ${{ vars.SSH_ALLOWED_SOURCE_IPS }}
          V_VM_USER: ${{ vars.VM_ADMIN_USERNAME }}
          V_PG_USER: ${{ vars.POSTGRES_ADMIN_USERNAME }}
          S_VM_PASS: ${{ secrets.VM_ADMIN_PASSWORD }}
          S_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          S_SINCOERP: ${{ secrets.SINCOERP_PASSWORD }}
          S_FLAGSMITH: ${{ secrets.FLAGSMITH_API_KEY }}
        run: |
          set -euo pipefail

          # Valor canónico en minúsculas, EXIGIDO del caller (fail-fast,
          # coherente con el apply): el subject OIDC usa el input crudo —
          # fuera del alcance de bash — y Entra matchea el subject
          # case-sensitive. Mejor morir aquí, claro, que en azure/login.
          env_lower="$(printf '%s' "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')"
          if [ "$ENVIRONMENT" != "$env_lower" ]; then
            echo "::error::environment '${ENVIRONMENT}' debe ir en minúsculas (dev|prod). Denegado (fail-closed)."
            exit 1
          fi
          ENVIRONMENT="$env_lower"

          # Backend: deriva de bounded_context + environment salvo override
          # explícito. Los nombres dev son legados (sin marcador de ambiente);
          # los prod codifican el ambiente (A6).
          case "$ENVIRONMENT" in
            dev)
              rg_default="rg-tfstate-${BC}-eus2-001"
              sa_default="sttfstate${BC}eus2001"
              ;;
            prod)
              rg_default="rg-tfstate-${BC}-prod-eus2-001"
              sa_default="sttfstate${BC}prodeus2001"
              ;;
            *)
              echo "::error::environment '${ENVIRONMENT}' no soportado (dev|prod)."
              exit 1
              ;;
          esac
          backend_rg="${BACKEND_RG:-${rg_default}}"
          backend_sa="${BACKEND_SA:-${sa_default}}"
          backend_key="${BACKEND_KEY_OVERRIDE:-${BC}-${ENVIRONMENT}.tfstate}"

          # Coherente con el apply: los overrides backend_* no pueden apuntar a
          # un state prod salvo que environment=prod (aquí evita, además, que
          # un plan de PR lea state prod y lo publique en el comment). Los
          # nombres dev nunca contienen "prod" (convención A6). El match se
          # hace en minúsculas: Azure trata los nombres de RG case-insensitive
          # (solo los de SA son minúsculas forzadas).
          if [ "$ENVIRONMENT" != "prod" ]; then
            case "$(printf '%s|%s|%s|%s' "$backend_rg" "$backend_sa" "$BACKEND_CONTAINER" "$backend_key" | tr '[:upper:]' '[:lower:]')" in
              *prod*)
                echo "::error::backend con marcador 'prod' (${backend_rg} / ${backend_sa} / ${BACKEND_CONTAINER} / ${backend_key}) exige environment=prod. Denegado (fail-closed)."
                exit 1
                ;;
            esac
          fi
          {
            echo "BACKEND_RESOURCE_GROUP=${backend_rg}"
            echo "BACKEND_STORAGE_ACCOUNT=${backend_sa}"
            echo "BACKEND_KEY=${backend_key}"
          } >> "$GITHUB_ENV"

          # TF_VARs comunes: exportar solo los no vacíos (un TF_VAR vacío de una
          # variable requerida rompería el plan; uno de una variable no declarada
          # Terraform lo ignora, pero igual evitamos exportarlo).
          emit() { [ -n "${2:-}" ] && printf 'TF_VAR_%s=%s\n' "$1" "$2" >> "$GITHUB_ENV" || true; }
          emit environment             "${ENVIRONMENT:-}"
          emit owner                   "${V_OWNER:-}"
          emit cost_center             "${V_COST_CENTER:-}"
          emit ssh_allowed_source_ips  "${V_SSH_IPS:-}"
          emit vm_admin_username       "${V_VM_USER:-}"
          emit postgres_admin_username "${V_PG_USER:-}"
          emit vm_admin_password       "${S_VM_PASS:-}"
          emit github_runner_pat       "${S_RUNNER_PAT:-}"
          emit sincoerp_password       "${S_SINCOERP:-}"
          emit flagsmith_api_key       "${S_FLAGSMITH:-}"

          # TF_VARs por-BC no sensibles (front_*) desde el JSON del caller (legado).
          echo "$EXTRA_TF_VARS_JSON" \
            | jq -r 'to_entries[] | select(.value != "" and .value != null) | "TF_VAR_\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

          # Convención TFVAR_*: toda var del caller `TFVAR_<NOMBRE>` (org/repo/
          # Environment, precedencia estándar de GitHub) se exporta como
          # `TF_VAR_<nombre>` (en minúsculas). El prefijo debe ir en MAYÚSCULAS
          # exactas (`TFVAR_`); una var mal escrita se ignora en silencio. Es la
          # vía por-ambiente para las TF_VARs por-BC: se define la MISMA var en
          # el Environment dev y prod, cada una con su valor, sin sufijos ni
          # callers divergentes. Se exporta al final: gana sobre
          # extra_tf_vars_json.
          #   - `(. // {})`: si el caller no tiene NINGUNA var, toJSON(vars) es
          #     `null` y jq abortaría; el guard lo trata como objeto vacío.
          #   - `error(...)` en valores con salto de línea (\n o \r): un newline
          #     rompería el formato KEY=VALUE de $GITHUB_ENV e inyectaría env
          #     vars; un \r suelto quedaría embebido como ruido. Mejor fallar
          #     claro que inyectar en silencio.
          #   - `TFVAR_ENVIRONMENT` se rechaza con error: `TF_VAR_environment`
          #     lo fija el input `environment` (que también deriva el backend);
          #     una var del caller que lo pisara rompería la coherencia
          #     env↔state en silencio (p. ej. recursos "prod" en el state dev).
          #   - Borde conocido: una var llamada exactamente `TFVAR_` produce
          #     `TF_VAR_=<valor>`; Terraform la ignora.
          echo "$ALL_VARS_JSON" \
            | jq -r '(. // {}) | to_entries[]
                | select((.key | startswith("TFVAR_")) and .value != "" and .value != null)
                | if .key == "TFVAR_ENVIRONMENT"
                  then error("TFVAR_ENVIRONMENT no está permitido: TF_VAR_environment lo fija el input environment (coherencia env↔state)")
                  elif (.value | test("\r|\n"))
                  then error("valor multilínea no soportado en \(.key): usa un valor de una sola línea")
                  else "TF_VAR_\(.key | sub("^TFVAR_"; "") | ascii_downcase)=\(.value)" end' \
            >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform ${{ inputs.tf_version }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="resource_group_name=${BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${{ inputs.backend_container }}" \
            -backend-config="key=${BACKEND_KEY}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout=${{ inputs.plan_lock_timeout }} -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: terraform show (texto del plan)
        if: always() && steps.plan.outputs.exitcode == '0'
        run: terraform show -no-color tfplan > plan.txt

      - name: Comentar el plan en el PR
        if: always() && inputs.comment_on_pr && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          COMMENT_MAX_CHARS: ${{ inputs.comment_max_chars }}
          BOUNDED_CONTEXT: ${{ inputs.bounded_context }}
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const exitCode = process.env.PLAN_EXIT_CODE;
            const workdir = process.env.WORKING_DIRECTORY;
            const limit = parseInt(process.env.COMMENT_MAX_CHARS, 10);
            const bc = process.env.BOUNDED_CONTEXT;
            const env = process.env.ENVIRONMENT;
            // El marker identifica el comentario a actualizar. dev conserva el
            // marker histórico (los PRs abiertos siguen actualizando su comment);
            // otros ambientes usan marker propio para no pisar el plan de dev
            // cuando ambos comentan en el mismo PR.
            const marker = env === 'dev'
              ? '<!-- infra-plan-comment -->'
              : `<!-- infra-plan-comment:${env} -->`;
            const header = `### \`terraform plan\` — ${bc} (Azure ${env.toUpperCase()})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const planPath = `${workdir}/plan.txt`;

            let body;
            if (exitCode === '0' && fs.existsSync(planPath)) {
              let plan = fs.readFileSync(planPath, 'utf8');
              let truncated = false;
              if (plan.length > limit) {
                plan = plan.slice(0, limit);
                truncated = true;
              }
              body = [
                marker,
                header,
                '',
                truncated ? `> ⚠️ Plan truncado a ${limit} caracteres. Ver el [run completo](${runUrl}).` : `> Run: ${runUrl}`,
                '',
                '```hcl',
                plan,
                '```',
              ].join('\n');
            } else {
              body = [
                marker,
                header,
                '',
                `❌ El plan falló (exit ${exitCode}). Ver el [run completo](${runUrl}).`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail si el plan falló
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "terraform plan falló con exit ${{ steps.plan.outputs.exitcode }}"
          exit 1
