name: Drift check governance

# Verifica que los repos consumidores estén alineados con el manifest:
#   - dependabot.yml coincide con el render esperado
#   - workflows no tienen referencias al repo viejo (Cosmos.PlatformWorkflows)
#   - repos nuevos en la org sin entrada en manifest ni skip
# Reporta drift en una única issue actualizable en este repo.

on:
  schedule:
    # Domingos 06:00 UTC (01:00 Colombia)
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check-governance
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate App token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GOVERNANCE_SYNC_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_SYNC_APP_PRIVATE_KEY }}
          owner: Cosmos-SincoERP

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run drift check
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SELF_REPO: ${{ github.repository }}
        run: bash .github/scripts/drift-check-governance.sh
