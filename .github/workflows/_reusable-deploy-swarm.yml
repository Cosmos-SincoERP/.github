name: Deploy a Docker Swarm (reusable)

concurrency:
  group: deploy-${{ github.workflow }}-${{ inputs.stack_environment || 'default' }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      stack_file:
        description: "Ruta al docker stack compose file (relativa al checkout)."
        type: string
        required: true
      stack_name:
        description: "Nombre del stack en Swarm."
        type: string
        required: true
      image_tag:
        description: |
          Tag único a inyectar como variable de entorno IMAGE_TAG en el compose.
          Modo legado: aplica un mismo tag a todos los servicios del stack.
          Si se provee `image_tags_json`, este input se ignora.
        type: string
        required: false
        default: ""
      image_tags_json:
        description: |
          JSON object {"<servicio>": "<tag>", ...} con el tag a inyectar por servicio.
          Solo debe incluir los servicios cuyas imágenes cambiaron en este push;
          el resto se resuelve consultando Swarm (`docker service inspect`).
          Cada servicio del stack file genera la variable IMAGE_TAG_<UPPER_SNAKE>
          (ej: comandos-api → IMAGE_TAG_COMANDOS_API) lista para `${...}` en el compose.
        type: string
        required: false
        default: "{}"
      acr_name:
        description: "Nombre del ACR (sin .azurecr.io)."
        type: string
        # Sin default: cada caller lo pasa explícitamente desde el catálogo
        # `bounded-contexts.yml` (lo inyectan los wrappers de onboard-*), para
        # que el reusable no quede acoplado a ningún BC concreto.
        required: true
      repository_prefix:
        description: "Prefijo de los repositorios. Se inyecta como REPOSITORY_PREFIX en el compose."
        type: string
        # Sin default — ver nota en `acr_name`.
        required: true
      env_vars_json:
        description: "JSON object con variables de entorno extra a inyectar (key/value strings)."
        type: string
        required: false
        default: "{}"
      stack_environment:
        description: |
          Ambiente objetivo (dev|prod). No es una etiqueta decorativa: el gate de
          coherencia del primer step exige que `stack_file`, `key_vault_name` y
          `runner_group` lleven marcador `prod` cuando vale `prod`, y que NO lo
          lleven cuando vale otra cosa. `acr_name` queda fuera del gate (D-ACR).
        type: string
        required: false
        default: "dev"
      key_vault_name:
        description: "Nombre del Key Vault desde donde leer los secretos a materializar como Docker Swarm secrets."
        type: string
        # Sin default — ver nota en `acr_name`.
        required: true
      secret_names:
        description: |
          Lista separada por espacios de nombres de secretos en el Key Vault que el stack consume.
          Vacío deshabilita la materialización (útil para stacks sin secretos sensibles).
          Por cada nombre se crea un Docker Swarm secret versionado por hash (`<prefix>_<snake>_v<sha8>`)
          y se expone una env var `SWARM_SECRET_<UPPER_SNAKE>` para que el stack file la referencie
          en `name:` de cada secreto external.
        type: string
        required: false
        default: ""
      swarm_secret_prefix:
        description: |
          Prefijo del nombre del Swarm secret materializado (`<prefix>_<snake>_v<sha8>`).
          Se usa también para identificar los secrets propios al hacer GC de huérfanos.
          En contextos multi-dominio sobre la misma VM, cada dominio debe usar su propio prefijo.
        type: string
        # Sin default — ver nota en `acr_name`.
        required: true
      runner_group:
        description: |
          Runner group de GitHub Actions donde correr el job (ej. `swarm-deploy-appl`,
          `swarm-deploy-cont`). Cada caller debe declarar el suyo: el reusable no asume
          ninguno porque los runners self-hosted del plane comparten labels y el
          aislamiento por BC se hace exclusivamente vía runner group (ver
          `bounded-contexts.yml`).
        type: string
        required: true
      authorized_actor_team:
        description: |
          Slug de un team de la org. Si viene poblado, el deploy valida que
          `github.actor` — y en un RE-RUN también `github.triggering_actor`,
          cuando viene informado y difiere — sea miembro ACTIVO de ese team
          antes de tocar el Swarm, y falla si no (gate A5). Requiere el secret
          ACTOR_GATE_TOKEN. Vacío → sin gate (comportamiento actual).
        type: string
        required: false
        default: ""
    secrets:
      ACTOR_GATE_TOKEN:
        description: |
          Token con permiso de lectura de members de la org (fine-grained PAT
          'Organization members: Read' o token de App) para validar la membresía
          de `github.actor` en `authorized_actor_team` vía API. Obligatorio
          cuando `authorized_actor_team` viene poblado; el gate falla cerrado si
          falta. El GITHUB_TOKEN del run NO sirve (no lee teams de la org).
        required: false

permissions:
  contents: read

jobs:
  # Los dos gates viven en un JOB APARTE, no como primeros steps del deploy, y
  # `deploy` depende de él. La razón es que el job de deploy tiene steps con
  # `if: always()` —el GC de Swarm secrets, que ejecuta `docker secret rm`— que
  # se ejecutarían igual tras un gate denegado: el run quedaría rojo pero habría
  # tocado el Swarm de todas formas. Con el gate en su propio job, un veredicto
  # negativo deja `deploy` en skipped y NADA llega al runner self-hosted.
  # Corre en runner hospedado (como la réplica manual del gate en los callers):
  # solo necesita bash y `gh api`.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Gate A5 de actor autorizado: primero de todo y fail-closed, antes del
      # checkout y de cualquier cosa que toque Azure o el Swarm.
      #
      # OPT-IN: el `if:` se activa SOLO con `authorized_actor_team` poblado, a
      # diferencia del gate gemelo de `_reusable-terraform-apply.yml`, que además
      # lo activa con `environment == 'prod'`. La razón es de migración, no de
      # criterio: los callers prod de swarm y de front llevan hoy el gate como
      # una RÉPLICA manual en un job propio (un job `uses:` no admite `steps:`)
      # y ninguno pasa `ACTOR_GATE_TOKEN` al reusable, así que el invariante
      # `prod ⇒ gate` los denegaría a todos de golpe. El cuerpo del step SÍ es
      # el mismo —incluido el chequeo `prod ⇒ team obligatorio`, hoy inalcanzable—
      # para que, cuando los callers hayan migrado, activar el invariante sea
      # cambiar solo esta línea `if:` y ya no rompa a nadie.
      #
      # Idempotente con la réplica: un caller que conserve su job `gate` y además
      # pase el input evalúa el mismo predicado dos veces, con el mismo veredicto.
      - name: Gate de actor autorizado
        if: inputs.authorized_actor_team != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTOR_GATE_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TEAM: ${{ inputs.authorized_actor_team }}
          ENVIRONMENT: ${{ inputs.stack_environment }}
          # Validamos AMBOS: `actor` es quien disparó originalmente; en un
          # RE-RUN, `actor` conserva ese valor y `triggering_actor` es quien
          # re-ejecuta. Exigir que los dos estén en el team cierra el bypass de
          # "un autorizado dispara, un no-autorizado re-ejecuta".
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # GitHub compara strings case-insensitive en `if:` (así entró este
          # step) pero bash no. El valor canónico es minúsculas y se EXIGE del
          # caller (fail-fast): GitHub Expressions no tiene lower(), así que un
          # "PROD" crudo llegaría intacto al `concurrency.group` y al resumen.
          env_lower="$(printf '%s' "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')"
          if [ "$ENVIRONMENT" != "$env_lower" ]; then
            echo "::error::environment '${ENVIRONMENT}' debe ir en minúsculas (dev|prod). Deploy denegado (fail-closed)."
            exit 1
          fi
          ENVIRONMENT="$env_lower"

          # prod ⇒ gate obligatorio: sin team declarado, denegar (fail-closed).
          if [ "$ENVIRONMENT" = "prod" ] && [ -z "${TEAM:-}" ]; then
            echo "::error::environment=prod exige 'authorized_actor_team'. Deploy denegado (fail-closed)."
            exit 1
          fi

          # prod ⇒ solo desde main (A5 'workflow_dispatch sobre main'). Defensa
          # en profundidad: la red primaria es la deployment branch policy `main`
          # del Environment prod (pieza 1), pero no dependemos solo de ella.
          if [ "$ENVIRONMENT" = "prod" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::deploy prod solo desde refs/heads/main (ref actual: ${REF}). Deploy denegado."
            exit 1
          fi

          # prod ⇒ solo workflow_dispatch (A5 'acto deliberado'): un caller que
          # conecte el deploy prod a `push` desplegaría automático post-merge si
          # el merger es del team — el gate de actor no distingue ese caso, este
          # check sí. `event_name` es el evento del workflow CALLER.
          if [ "$ENVIRONMENT" = "prod" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::deploy prod solo por workflow_dispatch (evento actual: ${EVENT_NAME}). Deploy denegado (fail-closed)."
            exit 1
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::gate activo pero falta el secret ACTOR_GATE_TOKEN (el caller debe pasarlo, p. ej. con \`secrets: inherit\`). Deploy denegado (fail-closed)."
            exit 1
          fi

          # Verifica membresía ACTIVA en el team para cada actor relevante.
          check_member() {
            local who="$1"
            local st
            st="$(gh api "orgs/${ORG}/teams/${TEAM}/memberships/${who}" --jq .state 2>/dev/null || true)"
            if [ "$st" != "active" ]; then
              echo "::error::'${who}' no es miembro activo del team '${ORG}/${TEAM}'. Deploy denegado."
              exit 1
            fi
          }
          check_member "$ACTOR"
          if [ -n "${TRIGGERING_ACTOR:-}" ] && [ "$TRIGGERING_ACTOR" != "$ACTOR" ]; then
            check_member "$TRIGGERING_ACTOR"
          fi
          echo "Actor(es) autorizado(s) por el team '${ORG}/${TEAM}': ${ACTOR}${TRIGGERING_ACTOR:+, ${TRIGGERING_ACTOR}}."

      # Gate de coherencia ambiente↔recursos. Sin esto `stack_environment` es un
      # rótulo cosmético: el reusable despliega dev y prod con el mismo código y
      # todo el aislamiento vive en los inputs del caller, así que un caller prod
      # con el Key Vault o el runner de dev materializa secretos de dev en la VM
      # de dev y se reporta como prod. Misma forma que el gate A5 de
      # `_reusable-terraform-plan.yml` (match en minúsculas, fail-closed) y en el
      # primer step del job para morir antes de tocar Azure o el Swarm.
      #
      # `acr_name` NO se valida: por la decisión D-ACR prod no tiene registry
      # propio y reusa `cr<bc>deveus2001` — con marcador `dev` — también en prod.
      # Exigirle marcador `prod` rompería el deploy de producción de todos los BC.
      - name: Validar coherencia ambiente↔recursos
        shell: bash
        env:
          STACK_ENV: ${{ inputs.stack_environment }}
          STACK_FILE: ${{ inputs.stack_file }}
          KEY_VAULT: ${{ inputs.key_vault_name }}
          RUNNER_GROUP: ${{ inputs.runner_group }}
        run: |
          set -euo pipefail

          # El match se hace en minúsculas: los nombres de Key Vault y los
          # runner groups son case-insensitive, y el caller puede escribir `Prod`.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          es_prod=false
          if [ "$(lower "$STACK_ENV")" = "prod" ]; then
            es_prod=true
          fi

          # Solo los recursos con una instancia por ambiente (ver D-ACR arriba).
          RECURSOS=(
            "stack_file=$STACK_FILE"
            "key_vault_name=$KEY_VAULT"
            "runner_group=$RUNNER_GROUP"
          )

          incoherentes=()
          for par in "${RECURSOS[@]}"; do
            marcado=false
            case "$(lower "${par#*=}")" in
              *prod*) marcado=true ;;
            esac
            [ "$marcado" = "$es_prod" ] || incoherentes+=("$par")
          done

          if [ ${#incoherentes[@]} -gt 0 ]; then
            if [ "$es_prod" = true ]; then
              echo "::error::stack_environment='${STACK_ENV}' exige recursos con marcador 'prod'; sin él: ${incoherentes[*]}. Denegado (fail-closed)."
            else
              echo "::error::recurso con marcador 'prod' (${incoherentes[*]}) exige stack_environment=prod, y llegó stack_environment='${STACK_ENV}'. Denegado (fail-closed)."
            fi
            exit 1
          fi
          echo "Coherencia ambiente↔recursos OK (stack_environment='${STACK_ENV}')"


  deploy:
    name: docker stack deploy ${{ inputs.stack_name }}
    needs: gate
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: [self-hosted, azure, swarm-deploy]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login al ACR (Managed Identity)
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          az login --identity --output none
          az acr login --name "$ACR"

      - name: Materializar secretos del Key Vault como Docker Swarm secrets
        if: inputs.secret_names != ''
        shell: bash
        env:
          KV: ${{ inputs.key_vault_name }}
          SECRETS: ${{ inputs.secret_names }}
          PREFIX: ${{ inputs.swarm_secret_prefix }}
        run: |
          set -euo pipefail
          for sec in $SECRETS; do
            value=$(az keyvault secret show \
              --vault-name "$KV" --name "$sec" --query value -o tsv)
            # Hash del VALOR. Si el valor en KV no cambia, el nombre del secret en
            # Swarm tampoco; si cambia, Swarm ve un secret nuevo y dispara rolling
            # update sin tocar la imagen.
            hash=$(printf '%s' "$value" | sha256sum | cut -c1-8)
            sec_swarm="${PREFIX}_$(echo "$sec" | tr '-' '_')_v${hash}"
            # `|| true` cubre el caso "ya existe con este hash" (idempotente);
            # `inspect` valida que existió por la razón correcta y no por otro
            # error como falta de permisos del daemon.
            printf '%s' "$value" | docker secret create "$sec_swarm" - 2>/dev/null || true
            docker secret inspect "$sec_swarm" >/dev/null
            varname="SWARM_SECRET_$(echo "$sec" | tr '-' '_' | tr '[:lower:]' '[:upper:]')"
            echo "$varname=$sec_swarm" >> "$GITHUB_ENV"
          done
          unset value

      - name: Verificar existencia del stack file
        shell: bash
        env:
          STACK_FILE: ${{ inputs.stack_file }}
        run: |
          set -euo pipefail
          if [[ ! -f "$STACK_FILE" ]]; then
            echo "::error::Stack file no encontrado: $STACK_FILE"
            exit 1
          fi
          echo "Stack file encontrado: $STACK_FILE"

      - name: Resolver tags por servicio
        shell: bash
        env:
          STACK_FILE: ${{ inputs.stack_file }}
          STACK_NAME: ${{ inputs.stack_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_TAGS_JSON: ${{ inputs.image_tags_json }}
          ACR_NAME: ${{ inputs.acr_name }}
          ACR_LOGIN_SERVER: ${{ inputs.acr_name }}.azurecr.io
          REPOSITORY_PREFIX: ${{ inputs.repository_prefix }}
        run: |
          set -euo pipefail

          # Vars comunes que el stack file pueda usar.
          {
            echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER"
            echo "REPOSITORY_PREFIX=$REPOSITORY_PREFIX"
          } >> "$GITHUB_ENV"

          # Modo legado: image_tag provisto sin image_tags_json → se inyecta
          # como IMAGE_TAG global y nos saltamos la resolución por servicio.
          if [[ -n "$IMAGE_TAG" && ( "$IMAGE_TAGS_JSON" == "{}" || -z "$IMAGE_TAGS_JSON" ) ]]; then
            echo "Modo legado: IMAGE_TAG=$IMAGE_TAG"
            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
            exit 0
          fi

          # Si ambos vienen vacíos, caemos al modo por-servicio: todos los
          # servicios tomarán su tag actualmente desplegado en Swarm (resync
          # del stack template sin cambios de imagen). Si tampoco hay tag en
          # Swarm (servicio nuevo o cadena de deploys rotos), se intenta el
          # último `main-*` publicado en el ACR antes de declarar missing.

          # Modo por-servicio: para cada servicio del stack file, decide el tag.
          if ! echo "$IMAGE_TAGS_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::image_tags_json no es un objeto JSON válido"
            exit 1
          fi

          # Tags actualmente desplegados en Swarm para este stack.
          declare -A CURRENT_TAGS=()
          while IFS='=' read -r svc image; do
            [[ -z "$svc" ]] && continue
            stripped="${image%%@*}"        # quita el digest @sha256:...
            tag="${stripped##*:}"          # extrae el tag tras el último ':'
            CURRENT_TAGS["$svc"]="$tag"
          done < <(
            docker stack services "$STACK_NAME" --format '{{.Name}}={{.Image}}' 2>/dev/null \
              | sed "s|^${STACK_NAME}_||"
          )

          # Servicios declarados en el stack file.
          mapfile -t SERVICES < <(yq '.services | keys | .[]' "$STACK_FILE")
          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo "::error::No se pudieron leer servicios de $STACK_FILE"
            exit 1
          fi

          # Extrae el nombre de imagen ACR de un servicio (ej. `entradas-api`)
          # parseando la referencia del stack file. Asume el patrón canónico
          # `${ACR_LOGIN_SERVER}/${REPOSITORY_PREFIX}/<imagen>:<tag>`. Devuelve
          # vacío si el patrón no coincide (caller hace fallback a missing).
          extract_image_name() {
            local svc="$1"
            local img_ref delim img_name
            img_ref=$(yq ".services.\"$svc\".image" "$STACK_FILE")
            delim='${REPOSITORY_PREFIX}/'
            # ##*"$delim" → strip más largo del prefijo hasta `${REPOSITORY_PREFIX}/`
            local stripped="${img_ref##*"$delim"}"
            # Si no hubo match, ${img_ref##...} devuelve el original sin cambios.
            [[ "$stripped" == "$img_ref" ]] && { echo ""; return; }
            img_name="${stripped%%:*}"
            echo "$img_name"
          }

          missing=()
          for svc in "${SERVICES[@]}"; do
            tag=$(echo "$IMAGE_TAGS_JSON" | jq -r --arg s "$svc" '.[$s] // empty')
            origen="nuevo"
            if [[ -z "$tag" ]]; then
              tag="${CURRENT_TAGS[$svc]:-}"
              origen="actual en Swarm"
            fi
            if [[ -z "$tag" ]]; then
              # Fallback final: último tag main-* del repositorio en ACR.
              # Self-healing para primer deploy o cuando deploys previos fallaron.
              img_name=$(extract_image_name "$svc")
              if [[ -n "$img_name" ]]; then
                acr_tag=$(az acr repository show-tags \
                  --name "$ACR_NAME" \
                  --repository "${REPOSITORY_PREFIX}/${img_name}" \
                  --orderby time_desc \
                  --top 50 \
                  --query "[?starts_with(@, 'main-')] | [0]" \
                  -o tsv 2>/dev/null || true)
                if [[ -n "$acr_tag" && "$acr_tag" != "null" ]]; then
                  tag="$acr_tag"
                  origen="último main-* en ACR (${REPOSITORY_PREFIX}/${img_name})"
                fi
              fi
            fi
            if [[ -z "$tag" ]]; then
              missing+=("$svc")
              continue
            fi
            upper=$(echo "$svc" | tr '[:lower:]-' '[:upper:]_')
            var_name="IMAGE_TAG_${upper}"
            echo "  $svc → $tag ($origen) → \$$var_name"
            echo "$var_name=$tag" >> "$GITHUB_ENV"
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Servicios sin tag (ni en image_tags_json, ni desplegados en Swarm, ni con tag main-* en ACR): ${missing[*]}. Verifica que el repositorio ${REPOSITORY_PREFIX}/<imagen> tenga al menos un build de main publicado, o pasa image_tags_json explícito vía workflow_dispatch."
            exit 1
          fi

      - name: Validar stack file con variables resueltas
        shell: bash
        env:
          STACK_FILE: ${{ inputs.stack_file }}
        run: |
          set -euo pipefail
          docker stack config -c "$STACK_FILE" >/dev/null
          echo "Stack file válido"

      - name: Deploy
        shell: bash
        env:
          STACK_FILE: ${{ inputs.stack_file }}
          STACK_NAME: ${{ inputs.stack_name }}
          EXTRA_ENV: ${{ inputs.env_vars_json }}
        run: |
          set -euo pipefail
          # Marca de tiempo (epoch) para que el paso "Verificar convergencia"
          # distinga el update de ESTE deploy de un UpdateStatus viejo de un
          # deploy anterior (evita falsos positivos por estado rezagado).
          echo "DEPLOY_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          if [[ "$EXTRA_ENV" != "{}" && -n "$EXTRA_ENV" ]]; then
            while IFS='=' read -r k v; do
              [[ -z "$k" ]] && continue
              export "$k=$v"
            done < <(echo "$EXTRA_ENV" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          fi

          docker stack deploy \
            --with-registry-auth \
            --resolve-image always \
            -c "$STACK_FILE" \
            "$STACK_NAME"

      - name: Verificar convergencia del despliegue
        shell: bash
        env:
          STACK_FILE: ${{ inputs.stack_file }}
          STACK_NAME: ${{ inputs.stack_name }}
          # Ventana total de espera (compartida entre servicios: el bucle evalúa
          # todos en cada tick, así el wall-clock no crece con el nº de servicios).
          # Un rollback de Swarm se detecta mucho antes; el timeout solo cubre
          # updates que quedan colgados (pull lento, arranque con migraciones…).
          TIMEOUT_SECONDS: "300"
          POLL_INTERVAL: "8"
        # `docker stack deploy` retorna apenas Swarm ACEPTA el spec, no cuando el
        # contenedor nuevo queda sano. Sin esto, un update que falla y Swarm
        # revierte (`failure_action: rollback`) o pausa se reporta como deploy
        # exitoso y la imagen vieja sigue viva en silencio. Aquí esperamos la
        # convergencia real y, si no converge, FALLAMOS el job volcando el porqué.
        run: |
          set -uo pipefail   # sin -e: los fallos se manejan y se vuelca diagnóstico
          deploy_start="${DEPLOY_START_EPOCH:-0}"

          mapfile -t SERVICES < <(yq '.services | keys | .[]' "$STACK_FILE")
          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo "::error::No se pudieron leer servicios de $STACK_FILE"
            exit 1
          fi

          # Vuelca el porqué de un servicio que no convergió: error de la tarea
          # (columna Error de `service ps`) + logs del contenedor (la excepción real).
          dump() {
            local full="$1"
            {
              echo ""
              echo "### ❌ \`$full\` no convergió"
              echo ""
              echo "**Tareas — \`docker service ps --no-trunc\`:**"
              echo '```'
              docker service ps "$full" --no-trunc \
                --format 'table {{.Name}}\t{{.Image}}\t{{.Node}}\t{{.DesiredState}}\t{{.CurrentState}}\t{{.Error}}' 2>&1 | head -40
              echo '```'
              echo ""
              echo "**Logs — \`docker service logs --tail 120\`:**"
              echo '```'
              docker service logs "$full" --tail 120 --no-trunc --timestamps 2>&1 | tail -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "----- service ps: $full -----"
            docker service ps "$full" --no-trunc 2>&1 | head -40
            echo "----- service logs: $full -----"
            docker service logs "$full" --tail 120 --no-trunc 2>&1 | tail -120
          }

          # Deja en VERDICT (ok|fail|pending) + V_STATE/V_REPS el estado actual del
          # servicio. NO se llama en $() para poder fijar esas variables globales.
          evaluate() {
            local full="$1" raw state started_epoch recent reps running desired
            raw=$(docker service inspect "$full" \
              --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}|{{if .UpdateStatus.StartedAt}}{{.UpdateStatus.StartedAt.Unix}}{{end}}{{end}}' 2>/dev/null || echo "")
            state="${raw%%|*}"
            started_epoch="${raw#*|}"
            [[ "$raw" != *"|"* ]] && started_epoch=""
            [[ "$started_epoch" =~ ^-?[0-9]+$ ]] || started_epoch=0
            recent="false"; (( started_epoch >= deploy_start )) && recent="true"
            # Réplicas del servicio EXACTO (evita match por prefijo del --filter).
            reps=$(docker service ls --filter "name=${full}" --format '{{.Name}}|{{.Replicas}}' 2>/dev/null \
              | awk -F'|' -v n="$full" '$1==n{print $2; exit}')
            running="${reps%%/*}"; desired="${reps##*/}"
            V_STATE="$state"; V_REPS="$reps"

            # Rollback/pausa disparado por ESTE deploy → la imagen nueva no quedó sana.
            if [[ "$recent" == "true" && ( "$state" == "rollback_completed" || "$state" == "rollback_paused" || "$state" == "paused" ) ]]; then
              VERDICT="fail"; return
            fi
            # Convergido: réplicas al día y (update completado, sin update, o el
            # update no es de este deploy → no lo juzgamos por un estado viejo).
            if [[ -n "$reps" && "$running" == "$desired" && ( "$recent" != "true" || "$state" == "completed" ) ]]; then
              VERDICT="ok"; return
            fi
            VERDICT="pending"
          }

          declare -A RESULT
          for svc in "${SERVICES[@]}"; do RESULT["$svc"]="pending"; done
          pending=${#SERVICES[@]}
          deadline=$(( SECONDS + TIMEOUT_SECONDS ))

          while (( SECONDS < deadline && pending > 0 )); do
            for svc in "${SERVICES[@]}"; do
              [[ "${RESULT[$svc]}" != "pending" ]] && continue
              VERDICT="pending"; V_STATE=""; V_REPS=""
              evaluate "${STACK_NAME}_${svc}"
              case "$VERDICT" in
                ok)
                  RESULT["$svc"]="ok"; pending=$((pending - 1))
                  echo "✅ ${STACK_NAME}_${svc} convergió (estado=${V_STATE:-none}, réplicas=${V_REPS:-n/a})"
                  ;;
                fail)
                  RESULT["$svc"]="fail"; pending=$((pending - 1))
                  echo "::error::${STACK_NAME}_${svc}: Swarm revirtió/pausó el update (estado=${V_STATE}); la imagen nueva no quedó sana."
                  ;;
              esac
            done
            (( pending > 0 )) && sleep "$POLL_INTERVAL"
          done

          # Lo que siga pendiente tras el deadline = no convergió a tiempo (timeout).
          for svc in "${SERVICES[@]}"; do
            if [[ "${RESULT[$svc]}" == "pending" ]]; then
              RESULT["$svc"]="fail"
              echo "::error::${STACK_NAME}_${svc}: no convergió en ${TIMEOUT_SECONDS}s (timeout)."
            fi
          done

          failed=()
          for svc in "${SERVICES[@]}"; do
            [[ "${RESULT[$svc]}" == "fail" ]] && failed+=("${STACK_NAME}_${svc}")
          done

          if (( ${#failed[@]} > 0 )); then
            echo "## ❌ Deploy Swarm — no convergió" >> "$GITHUB_STEP_SUMMARY"
            for full in "${failed[@]}"; do dump "$full"; done
            echo "::error::Despliegue no convergió: ${failed[*]}. La imagen nueva no quedó sana (posible rollback de Swarm); ver diagnóstico arriba."
            exit 1
          fi
          echo "✅ Todos los servicios del stack convergieron."

      - name: GC de Swarm secrets ${{ inputs.swarm_secret_prefix }}_* huérfanos
        if: always() && inputs.secret_names != ''
        shell: bash
        env:
          PREFIX: ${{ inputs.swarm_secret_prefix }}
        # Borra secrets <prefix>_* sin uso y con edad > 1h. La gate de edad evita
        # romper deploys paralelos a otros stacks que ya crearon su secret
        # pero aún no aplicaron `stack deploy` (ventana de pocos segundos).
        run: |
          set -euo pipefail
          in_use=$(docker service ls -q | xargs -r -n1 docker service inspect \
            --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{.SecretName}}{{"\n"}}{{end}}' \
            | sort -u)
          all_ours=$(docker secret ls --format '{{.Name}}' | grep "^${PREFIX}_" || true)
          now=$(date +%s)
          while IFS= read -r orphan; do
            [[ -z "$orphan" ]] && continue
            created=$(docker secret inspect "$orphan" --format '{{.CreatedAt}}')
            created_ep=$(date -d "$created" +%s 2>/dev/null || echo "$now")
            age=$(( now - created_ep ))
            if (( age > 3600 )); then
              echo "GC: removiendo $orphan (edad ${age}s, no referenciado)"
              docker secret rm "$orphan" || true
            fi
          done < <(comm -23 <(echo "$all_ours" | sort -u) <(echo "$in_use"))

      - name: Resumen
        if: always()
        shell: bash
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          STACK_ENV: ${{ inputs.stack_environment }}
        run: |
          list=$(docker stack services "$STACK_NAME" --format '{{.Name}}|{{.Image}}|{{.Replicas}}' 2>/dev/null || true)
          {
            echo "## Deploy Swarm — \`$STACK_NAME\` (\`$STACK_ENV\`)"
            echo ""
            if [[ -n "$list" ]]; then
              echo "| Servicio | Imagen | Réplicas |"
              echo "|---|---|---|"
              echo "$list" | awk -F'|' '{ printf "| `%s` | `%s` | %s |\n", $1, $2, $3 }'
            else
              echo "_No fue posible listar servicios._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
