name: Crear repo (golden path)

# Golden path de creación de repos gobernados. Dado un arquetipo, crea el repo,
# aplica settings, scaffoldea los workflows del arquetipo, hace el commit inicial
# de main (la App es bypass actor del ruleset org) y registra la entrada en el
# manifest vía PR. Ver ADR 0004 y docs/archetypes/README.md.
#
# Precondiciones (configuración fuera del repo, ver ADR 0004 §precondiciones):
#   - La App tiene Administration (org + repo), Contents, Workflows y Pull requests.
#   - La App está en la bypass list del ruleset org `~DEFAULT_BRANCH` (B.1).

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Nombre del repo nuevo (sin owner). Ej: Cosmos.NuevoServicio'
        type: string
        required: true
      archetype:
        description: 'Arquetipo del repo'
        type: choice
        required: true
        options:
          - dotnet-service
          - dotnet-library-nuget
          - frontend
          - gateway
          - infra
          - placeholder
      visibility:
        description: 'Visibilidad del repo'
        type: choice
        default: private
        options:
          - private
          - public
      bc_key:
        description: 'Clave del bounded context (ej. oxp). Requerido por service/frontend/gateway/infra.'
        type: string
        default: ''
      description:
        description: 'Descripción del repo (opcional)'
        type: string
        default: ''
      dry_run:
        description: 'Solo validar y mostrar el plan, sin crear nada'
        type: boolean
        default: true
      set_required_checks:
        description: 'Crear el repo-level ruleset de required status checks'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: create-repo-${{ inputs.repo_name }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Token efímero de la App. Si se opta por una App separada de creación,
      # cambiar estos secrets por los de esa App (ver ADR 0004).
      - name: Generate App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GOVERNANCE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_SYNC_APP_PRIVATE_KEY }}
          owner: Cosmos-SincoERP

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run create-repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_NAME: ${{ inputs.repo_name }}
          ARCHETYPE: ${{ inputs.archetype }}
          VISIBILITY: ${{ inputs.visibility }}
          BC_KEY: ${{ inputs.bc_key }}
          DESCRIPTION: ${{ inputs.description }}
          DRY_RUN: ${{ inputs.dry_run }}
          SET_REQUIRED_CHECKS: ${{ inputs.set_required_checks }}
          RUN_SHA: ${{ github.sha }}
        run: bash .github/scripts/create-repo.sh
