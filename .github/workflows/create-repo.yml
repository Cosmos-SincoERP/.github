name: Crear repo

# Golden path de creación de repos gobernados. Crea el repo, aplica settings,
# scaffoldea el baseline de seguridad (security-checks.yml), hace el commit inicial
# de main (la App es bypass actor del ruleset org) y registra la entrada en el
# manifest vía PR. El CI/CD de negocio/devops NO lo crea el golden path: se añade
# aparte (skills de onboarding o a mano). Ver ADR 0004 y ADR 0005.
#
# Precondiciones (configuración fuera del repo, ver ADR 0004 §precondiciones):
#   - La App tiene Administration (org + repo), Contents, Workflows y Pull requests.
#   - La App está en la bypass list del ruleset org `~DEFAULT_BRANCH` (B.1).

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Nombre del repo nuevo (sin owner). Ej: Cosmos.NuevoServicio'
        type: string
        required: true
      dry_run:
        description: 'Solo validar y mostrar el plan, sin crear nada'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: create-repo-${{ inputs.repo_name }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Token efímero de la App dedicada de creación (cosmos-repo-creator),
      # separada de la del sync para acotar el blast radius (ver ADR 0004).
      # Se genera ANTES del checkout para que el checkout (y por tanto `origin`)
      # quede autenticado como la App: si no, actions/checkout inyecta un
      # http.extraheader con el GITHUB_TOKEN que sobreescribe cualquier token en
      # la URL de push y la rama del manifest se rechazaría con 403.
      - name: Generate App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REPO_CREATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_CREATOR_APP_PRIVATE_KEY }}
          owner: Cosmos-SincoERP

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run create-repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO_NAME: ${{ inputs.repo_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_SHA: ${{ github.sha }}
        run: bash .github/scripts/create-repo.sh
