name: CI Front (reusable)

concurrency:
  # La clave `working_directory` permite que un monorepo llame a este reusable
  # una vez por app desde el mismo PR sin que las llamadas se cancelen entre sí;
  # un re-push de la misma app sigue cancelando su propio run viejo.
  group: pr-${{ github.head_ref }}-${{ github.workflow }}-${{ inputs.working_directory }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directorio donde está el package.json."
        type: string
        required: false
        default: "."
      bun_version:
        description: "Versión de Bun a instalar."
        type: string
        required: false
        default: "latest"
      run_lint:
        description: "Ejecutar `bun run lint`."
        type: boolean
        required: false
        default: true
      run_test:
        description: "Ejecutar `bun run test`."
        type: boolean
        required: false
        default: true
      run_build:
        description: "Ejecutar `bun run build`."
        type: boolean
        required: false
        default: true
      github_packages:
        description: |
          Si el front consume paquetes privados del org desde GitHub Packages
          (p. ej. `@cosmos-sincoerp/asistente`). Cuando es `true`, escribe un
          `.npmrc` con el scope `@cosmos-sincoerp` apuntado a npm.pkg.github.com
          y autenticado con el GITHUB_TOKEN del workflow antes de instalar.
          Dejar en `false` (default) si el front no usa GitHub Packages — el
          comportamiento queda idéntico al actual.
        type: boolean
        required: false
        default: false

# `packages: read` solo se ejerce cuando `github_packages: true`; declararlo
# siempre no afecta a los fronts que no lo usan (el GITHUB_TOKEN simplemente
# no se consume).
permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: bun lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun ${{ inputs.bun_version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Cache de Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working_directory), format('{0}/bun.lockb', inputs.working_directory)) }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Auth GitHub Packages (scope @cosmos-sincoerp)
        if: inputs.github_packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `.npmrc` en el working_directory: mapea el scope del org a GitHub
          # Packages y autentica con el GITHUB_TOKEN del workflow (read:packages).
          {
            echo '@cosmos-sincoerp:registry=https://npm.pkg.github.com'
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        run: bun run lint

      - name: Test
        if: inputs.run_test
        run: bun run test

      - name: Build
        if: inputs.run_build
        run: bun run build

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "## CI Front (Bun)"
            echo ""
            echo "| Etapa | Ejecutada |"
            echo "|---|---|"
            echo "| Lint  | ${{ inputs.run_lint  && 'Sí' || 'No' }} |"
            echo "| Test  | ${{ inputs.run_test  && 'Sí' || 'No' }} |"
            echo "| Build | ${{ inputs.run_build && 'Sí' || 'No' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
