name: Cleanup ACR — tags de PR (reusable)

concurrency:
  group: pr-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      acr_name:
        description: "Nombre del ACR (sin .azurecr.io)."
        type: string
        # Sin default: cada caller lo pasa explícitamente desde el catálogo
        # `bounded-contexts.yml` (lo inyectan los wrappers de onboard-*), para
        # que el reusable no quede acoplado a ningún BC concreto.
        required: true
      repository_prefix:
        description: "Prefijo común de los repositorios a barrer (ej: '<bc-key>')."
        type: string
        # Sin default — ver nota en `acr_name`.
        required: true
      repositories_json:
        description: |
          JSON array con los nombres de repositorios (sin prefijo) a limpiar.
          Si se omite, descubre todos los repos bajo {repository_prefix}/*.
        type: string
        required: false
        default: "[]"
      pr_number:
        description: |
          Si se provee, modo dirigido: borra `pr-{N}` y `pr-{N}-*` en cada repo,
          sin verificar estado del PR (asume que el caller ya sabe que cerró).
          Si se omite, modo barrido: revisa todos los `pr-*` y borra los de PRs
          cerrados hace más de `min_age_days`, y purga los manifests huérfanos.
          En ambos modos rige la retención garantizada (ver job `cleanup`): el
          último `pr-*` del repositorio nunca se borra, aunque sea de este PR.
        type: string
        required: false
        default: ""
      keep_sha7:
        description: |
          Sólo aplica en modo dirigido. Cuando está, NO borra el alias
          `pr-{pr_number}` ni el inmutable `pr-{pr_number}-{keep_sha7}`. Útil
          para cleanup intra-PR: el wrapper invoca este reusable después de
          buildear el commit `<sha7>` y le pide preservar esa versión mientras
          borra las anteriores del mismo PR.
        type: string
        required: false
        default: ""
      min_age_days:
        description: "En modo barrido, edad mínima (en días) desde el cierre del PR para eliminar."
        type: number
        required: false
        default: 7
      dry_run:
        description: "Si es true, solo lista lo que borraría."
        type: boolean
        required: false
        default: false
      keep_last_pr:
        description: "Cuántos tags `pr-*` inmutables conserva cada repositorio, pase lo que pase."
        type: number
        required: false
        default: 3
      keep_last_main:
        description: "Cuántos tags `main-*` conserva cada repositorio. Sólo tiene efecto si la poda de `main-*` está habilitada (ver `runner_group_prod`)."
        type: number
        required: false
        default: 3
      runner_group:
        description: |
          Runner group de GitHub Actions donde correr el cleanup
          (ej. `swarm-deploy-appl`, `swarm-deploy-cont`). Cada caller debe
          declarar el suyo: el reusable no asume ninguno porque los runners
          self-hosted del plane comparten labels y el aislamiento por BC se
          hace exclusivamente vía runner group (ver `bounded-contexts.yml`).
        type: string
        required: true
      runner_group_prod:
        description: |
          Runner group del swarm de PRODUCCIÓN del BC (ej. `swarm-deploy-oxp-prod`).
          Declararlo HABILITA la poda de `main-*`: sin él, los `main-*` se
          conservan todos, que es el comportamiento histórico.

          La poda es segura porque el conjunto protegido incluye lo que cada
          swarm tiene DESPLEGADO, leído con `docker service inspect` en los dos
          runners. Hace falta porque prod sólo avanza por `workflow_dispatch`
          deliberado y queda muy por detrás de dev: en oxp/Radicación son ~79
          deploys a dev por 8 promociones a prod en 30 días, o sea unos 10
          `main-*` de distancia. Podar por «últimos N» sin esa exclusión borra
          la imagen que producción está corriendo.

          Si la lectura de cualquiera de los dos swarms falla, NO se poda
          ningún `main-*` en esa corrida (fail-closed).
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  # Tags que el swarm de PRODUCCIÓN tiene desplegados. Corre en el runner de
  # prod porque es el único que ve ese swarm; sólo lee. Es el conjunto que
  # vuelve segura la poda de `main-*`: sin él no se poda nada.
  tags-vivos-prod:
    name: Leer tags desplegados en prod
    if: inputs.runner_group_prod != ''
    runs-on:
      group: ${{ inputs.runner_group_prod }}
      labels: [self-hosted, azure, swarm-deploy]
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.vivos.outputs.tags }}
    steps:
      - name: Tags desplegados
        id: vivos
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
          PREFIX: ${{ inputs.repository_prefix }}
        run: |
          set -euo pipefail
          # Todos los servicios del swarm, no sólo los de un stack: en la VM
          # conviven el stack de la app y el de plataforma, y cualquier imagen
          # de este BC que esté corriendo tiene que quedar protegida.
          ids=$(docker service ls -q)
          vivos=$(mktemp)
          if [[ -n "$ids" ]]; then
            # shellcheck disable=SC2086
            docker service inspect $ids \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' \
              | sed 's/@.*//' \
              | grep -E "^${ACR}\.azurecr\.io/${PREFIX}/" \
              | sed -E "s|^${ACR}\.azurecr\.io/${PREFIX}/||" \
              | sort -u > "$vivos" || true
          fi
          echo "Tags desplegados en prod: $(wc -l < "$vivos" | tr -d ' ')"
          cat "$vivos"
          {
            echo "tags<<EOF"
            cat "$vivos"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  cleanup:
    name: Cleanup tags PR del ACR
    needs: [tags-vivos-prod]
    # `tags-vivos-prod` se saltea cuando el caller no declara runner_group_prod;
    # el cleanup corre igual, sólo que sin podar `main-*`.
    if: always() && contains(fromJSON('["success","skipped"]'), needs.tags-vivos-prod.result)
    runs-on:
      group: ${{ inputs.runner_group }}
      labels: [self-hosted, azure, swarm-deploy]
    timeout-minutes: 30
    steps:
      - name: Login a Azure (Managed Identity)
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
        run: |
          az login --identity --output none
          az acr login --name "$ACR"

      - name: Resolver lista de repositorios
        id: repos
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
          PREFIX: ${{ inputs.repository_prefix }}
          REPOS_JSON: ${{ inputs.repositories_json }}
        run: |
          set -euo pipefail
          tmp_file=$(mktemp)
          if [[ "$REPOS_JSON" != "[]" && -n "$REPOS_JSON" ]]; then
            echo "$REPOS_JSON" | jq -r '.[]' > "$tmp_file"
          else
            az acr repository list -n "$ACR" -o tsv \
              | grep "^${PREFIX}/" \
              | sed "s|^${PREFIX}/||" > "$tmp_file" || true
          fi
          count=$(wc -l < "$tmp_file" | tr -d ' ')
          echo "Repos a procesar: $count"
          cat "$tmp_file"
          {
            echo "list<<EOF"
            cat "$tmp_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # Contraparte de `tags-vivos-prod` para el swarm de DEV. Va como step y no
      # como job porque el cleanup ya corre en el runner de dev.
      - name: Leer tags desplegados en dev
        id: vivos_dev
        if: inputs.runner_group_prod != ''
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
          PREFIX: ${{ inputs.repository_prefix }}
        run: |
          set -euo pipefail
          ids=$(docker service ls -q)
          vivos=$(mktemp)
          if [[ -n "$ids" ]]; then
            # shellcheck disable=SC2086
            docker service inspect $ids \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' \
              | sed 's/@.*//' \
              | grep -E "^${ACR}\.azurecr\.io/${PREFIX}/" \
              | sed -E "s|^${ACR}\.azurecr\.io/${PREFIX}/||" \
              | sort -u > "$vivos" || true
          fi
          echo "Tags desplegados en dev: $(wc -l < "$vivos" | tr -d ' ')"
          cat "$vivos"
          {
            echo "tags<<EOF"
            cat "$vivos"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup
        id: cleanup
        if: steps.repos.outputs.count != '0'
        shell: bash
        env:
          ACR: ${{ inputs.acr_name }}
          PREFIX: ${{ inputs.repository_prefix }}
          PR_NUMBER: ${{ inputs.pr_number }}
          KEEP_SHA7: ${{ inputs.keep_sha7 }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ steps.repos.outputs.list }}
          KEEP_LAST_PR_IN: ${{ inputs.keep_last_pr }}
          KEEP_LAST_MAIN_IN: ${{ inputs.keep_last_main }}
          PODA_MAIN_HABILITADA: ${{ inputs.runner_group_prod != '' }}
          VIVOS_DEV: ${{ steps.vivos_dev.outputs.tags }}
          VIVOS_PROD: ${{ needs.tags-vivos-prod.outputs.tags }}
        run: |
          set -euo pipefail

          # ── Retención garantizada ────────────────────────────────────────
          # Pase lo que pase, cada repositorio conserva su última imagen `pr-*`
          # y sus 3 últimas `main-*`. Es un fail-safe DELIBERADAMENTE
          # independiente de la selección de abajo: si la API de GitHub
          # responde algo inesperado, o si `date -d` no parsea el `closed_at`
          # (cae a epoch 0 ⇒ "edad infinita" ⇒ borraría), el repositorio sigue
          # teniendo una imagen desplegable y el deploy a dev / la promoción a
          # prod no se quedan sin binario.
          #
          # Lo que protege a PRODUCCIÓN es más fuerte que este piso, y conviene
          # no confundirlos: los `main-*` NUNCA entran al conjunto de candidatos
          # a borrado —la selección de abajo sólo mira `pr-*`— así que un
          # `main-<sha7>` sobrevive indefinidamente aunque prod corra una
          # versión muy anterior a la de dev, que es el caso normal (prod sólo
          # avanza por `workflow_dispatch` deliberado). `KEEP_LAST_MAIN` es un
          # piso, no un tope: no hay poda de `main-*`.
          # Quien vaya a AGREGAR una política de retención de `main-*` —hoy no
          # existe y los repos acumulan cientos de tags— tiene que resolver
          # antes cómo excluir el tag que cada ambiente tiene desplegado; este
          # piso de 3 no alcanza para eso.
          KEEP_LAST_PR="${KEEP_LAST_PR_IN:-3}"
          KEEP_LAST_MAIN="${KEEP_LAST_MAIN_IN:-3}"
          # `untag` no libera bytes: deja el manifest huérfano. Se purga por
          # digest, pero sólo tras este margen. Antes eran 30 días porque Swarm
          # fija el digest al desplegar y lo reusa si una tarea necesita
          # re-pull; con el conjunto desplegado protegido por su tag, un
          # manifest sin tag ya no puede ser el de un servicio vivo y el margen
          # sólo tiene que cubrir operaciones en vuelo.
          PURGE_UNTAGGED_AFTER_DAYS=7
          # Paralelismo del borrado por digest. Deliberadamente por debajo del
          # `-P 6` del recorrido de referenciados: aquel sólo lee, éste borra.
          PURGE_PARALLELISM=4

          # ── Conjunto desplegado ──────────────────────────────────────────
          # Tags que los swarms de dev y prod tienen corriendo AHORA, leídos con
          # `docker service inspect` en cada runner. Es lo que permite podar
          # `main-*` sin borrarle la imagen a un ambiente: prod sólo avanza por
          # `workflow_dispatch` y queda muy por detrás de dev (en oxp/Radicación,
          # ~10 `main-*` de distancia), así que «últimos N» a secas no alcanza.
          desplegado_file=$(mktemp)
          printf '%s\n' "${VIVOS_DEV:-}" "${VIVOS_PROD:-}" \
            | grep -v '^$' | sort -u > "$desplegado_file" || true

          # Guarda de formato. Si los jobs que leen los swarms cambian su salida
          # y dejan de emitir `<repo>:<tag>`, el cruce de abajo no matchea nada
          # y la poda se quedaría sin su exclusión — en silencio, que es
          # exactamente el modo de fallo que esta exclusión existe para evitar.
          if [[ -s "$desplegado_file" ]] && grep -qvE '^[^:]+:[^:]+$' "$desplegado_file"; then
            echo "::error::Los tags desplegados no vienen en la forma '<repo>:<tag>':"
            grep -vE '^[^:]+:[^:]+$' "$desplegado_file" | sed 's/^/  /'
            exit 1
          fi

          poda_main=0
          if [[ "${PODA_MAIN_HABILITADA:-false}" == "true" ]]; then
            if [[ -s "$desplegado_file" ]]; then
              poda_main=1
              echo "Poda de main-* HABILITADA. Desplegado y protegido: $(wc -l < "$desplegado_file" | tr -d ' ') tag(s)"
              sed 's/^/  · /' "$desplegado_file"
            else
              # Fail-closed: `runner_group_prod` declarado pero ningún tag
              # desplegado significa que la lectura de los swarms no devolvió
              # nada. Podar a ciegas borraría la imagen viva de un ambiente.
              echo "::warning::La lectura de los swarms no devolvió ningún tag desplegado. Poda de main-* OMITIDA en esta corrida (fail-closed)."
            fi
          fi

          deleted_count=0
          purged_count=0
          deleted_file=$(mktemp)
          untag_fail_file=$(mktemp)
          # Cortocircuito: si el ACR deja de responder, reintentar tag por tag
          # sólo alarga el job hasta el timeout. A partir de este número de
          # fallos SEGUIDOS se deja de intentar y se reporta.
          #
          # Bajo `xargs -P` la racha no se puede contar exacto: se aproxima con
          # un archivo que cada fallo engruesa y cada éxito trunca. La única
          # carrera posible —un éxito truncando mientras un fallo anota— PIERDE
          # fallos, o sea que tarda de más en abrir el circuito. Es el lado
          # seguro: esto es una optimización del timeout, no una garantía.
          UNTAG_FAIL_STREAK_MAX=5
          streak_file=$(mktemp)
          circuit_file="$(mktemp -d)/abierto"
          # Paralelismo del untag. Al ras de la purga (4) y por debajo del
          # recorrido de referenciados (6) por la misma razón que aquella: esto
          # ESCRIBE en el registry, y saturar el ACR acá cuesta más que ir lento.
          UNTAG_PARALLELISM=4

          # Caché del estado de los PRs, compartida por TODO el barrido. Los
          # repositorios de imágenes son del mismo repo de GitHub y cada PR deja
          # varios tags (el alias `pr-N` más un `pr-N-<sha7>` por commit), así
          # que sin caché la misma consulta se repite decenas de veces: en
          # oxp/Radicación, 74 tags `pr-*` por repositorio sobre 35 PRs.
          pr_cache_dir=$(mktemp -d)

          export UNTAG_FAIL_STREAK_MAX
          export DELETED_FILE="$deleted_file"
          export UNTAG_FAIL_FILE="$untag_fail_file"
          export STREAK_FILE="$streak_file"
          export CIRCUIT_FILE="$circuit_file"
          export PR_CACHE_DIR="$pr_cache_dir"

          # Estado de un PR, memoizado. Emite "<state>\t<closed_at>", o falla y
          # emite el HTTP que lo impidió. El archivo de caché se publica con
          # `mv` —atómico dentro del mismo directorio—, así que un lector
          # concurrente ve el contenido completo o no ve nada; un miss cuesta
          # una consulta de más, nunca un JSON a medio escribir. Los fallos NO
          # se cachean: el llamador saltea el tag y el siguiente reintenta, que
          # es el lado seguro (cachear un 000 transitorio protegería de más,
          # pero cachear un estado equivocado borraría de más).
          consultar_estado_pr() {
            local pr_n="$1"
            local cache="$PR_CACHE_DIR/${pr_n}.tsv"
            local body tmp code

            if [[ -f "$cache" ]]; then
              cat "$cache"
              return 0
            fi

            body=$(mktemp)
            code=$(curl -s -o "$body" -w "%{http_code}" \
                     -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     -H "X-GitHub-Api-Version: 2022-11-28" \
                     "https://api.github.com/repos/${REPO_FULL}/pulls/${pr_n}" || echo 000)
            if [[ "$code" != "200" ]]; then
              rm -f "$body"
              printf '%s\n' "$code"
              return 1
            fi

            tmp=$(mktemp "$PR_CACHE_DIR/.tmpXXXXXX")
            jq -r '[.state, (.closed_at // "null")] | @tsv' "$body" > "$tmp"
            rm -f "$body"
            mv -f "$tmp" "$cache"
            cat "$cache"
          }
          export -f consultar_estado_pr

          # Decide y ejecuta el untag de UN tag. Es el cuerpo que corre bajo
          # `xargs -P`; va como función exportada, y no inline en el `bash -c`,
          # para no meter cien líneas dentro de comillas.
          #
          # Paralelizable porque las decisiones son independientes entre sí:
          # `tags_desc` y el conjunto protegido son un snapshot tomado ANTES del
          # barrido del repositorio, y ningún untag cambia qué está protegido.
          # Lo que sí comparten los workers son archivos, nunca variables: los
          # `printf >>` de una línea son atómicos bajo O_APPEND y el recuento
          # final sale de `wc -l`, no de un contador en memoria que el subshell
          # se llevaría a la tumba.
          procesar_tag() {
            local full="$1" tag="$2"
            local pr_n info state closed_at closed_epoch now_epoch age_days
            local untag_ok intento err

            # Un circuito abierto no aborta a los workers en vuelo; sólo evita
            # que los siguientes arranquen.
            if [[ -e "$CIRCUIT_FILE" ]]; then
              return 0
            fi

            # La retención garantizada se evalúa ANTES que `keep_sha7` y que
            # el estado del PR: es el piso que ninguna otra regla levanta.
            if grep -qxF "$tag" "$PROTECTED_FILE"; then
              echo "  Skip: $tag (retención garantizada)"
              return 0
            fi

            # En modo dirigido, si el caller pasó keep_sha7 (cleanup intra-PR),
            # preservar tanto el alias mutable `pr-{N}` como el inmutable
            # `pr-{N}-{keep_sha7}`. Los demás `pr-{N}-*` (commits anteriores
            # del mismo PR) sí se borran.
            if [[ -n "$PR_NUMBER" && -n "$KEEP_SHA7" ]] \
               && { [[ "$tag" == "pr-${PR_NUMBER}" ]] \
                    || [[ "$tag" == "pr-${PR_NUMBER}-${KEEP_SHA7}" ]]; }; then
              echo "  Skip: $tag (preservado por keep_sha7=$KEEP_SHA7)"
              return 0
            fi

            # Sólo los `pr-*` se consultan contra la API de GitHub. Un
            # `main-*` que llegó hasta acá no está protegido por retención ni
            # desplegado en ningún ambiente: se borra sin más trámite.
            if [[ -z "$PR_NUMBER" && "$tag" == pr-* ]]; then
              pr_n=$(sed -E 's/^pr-([0-9]+).*/\1/' <<< "$tag")
              if ! info=$(consultar_estado_pr "$pr_n"); then
                echo "  Skip: $tag (PR #$pr_n no encontrado, HTTP ${info:-000})"
                return 0
              fi
              IFS=$'\t' read -r state closed_at <<< "$info"

              if [[ "$state" == "open" ]]; then
                echo "  Skip: $tag (PR #$pr_n abierto)"
                return 0
              fi
              if [[ -n "$closed_at" && "$closed_at" != "null" ]]; then
                closed_epoch=$(date -d "$closed_at" +%s 2>/dev/null || echo 0)
                now_epoch=$(date +%s)
                age_days=$(( (now_epoch - closed_epoch) / 86400 ))
                if (( age_days < MIN_AGE_DAYS )); then
                  echo "  Skip: $tag (PR #$pr_n cerrado hace $age_days días < $MIN_AGE_DAYS)"
                  return 0
                fi
              fi
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [DRY-RUN] untag: ${full}:${tag}"
            else
              echo "  Untag: ${full}:${tag}"
              # `untag` borra SÓLO la referencia del tag. `repository delete
              # --image repo:tag` borraría el manifest entero y con él todos
              # los tags que lo comparten — y el promote a main re-taguea el
              # mismo manifest (`docker pull pr-N-<sha7>` → `push main-<X>`),
              # así que aquel borrado se llevaba en cascada el `main-<X>` que
              # el deploy tenía vivo. El espacio lo recupera la purga de
              # manifests huérfanos, más abajo.
              #
              # Un fallo transitorio —DNS del runner, throttling del ACR— NO
              # aborta el barrido. Se reintenta con backoff y, si persiste, el
              # tag se anota y se sigue con el resto; el job falla AL FINAL con
              # la lista. Antes cualquier error hacía `exit 1` en el acto y el
              # barrido quedaba a medias, para volver a fallar en el mismo
              # punto la semana siguiente: así croxpdeveus2001 encadenó cuatro
              # semanas sin limpiar y llegó a 495 GB sobre una cuota de 10 GB.
              untag_ok=0
              for intento in 1 2 3; do
                if err=$(az acr repository untag -n "$ACR" --image "${full}:${tag}" 2>&1 >/dev/null); then
                  untag_ok=1; break
                fi
                if grep -qiE "(does not exist|TagNotFound|not found)" <<< "$err"; then
                  echo "    $tag: ya no existe — carrera con otro run"
                  untag_ok=1; break
                fi
                if (( intento < 3 )); then
                  echo "    $tag: intento ${intento}/3 falló, reintento en $(( intento * 5 ))s: $err"
                  sleep $(( intento * 5 ))
                fi
              done
              if (( untag_ok == 1 )); then
                : > "$STREAK_FILE"
              else
                echo "::warning::No se pudo untaggear ${full}:${tag} tras 3 intentos: $err"
                printf '%s\n' "${full}:${tag}" >> "$UNTAG_FAIL_FILE"
                printf 'x\n' >> "$STREAK_FILE"
                # `mkdir` es la apertura atómica del circuito: de los workers
                # que crucen el umbral a la vez, sólo uno lo abre y sólo uno
                # emite el ::error::, en vez de uno por worker en vuelo.
                if (( $(wc -l < "$STREAK_FILE") >= UNTAG_FAIL_STREAK_MAX )) \
                   && mkdir "$CIRCUIT_FILE" 2>/dev/null; then
                  echo "::error::${UNTAG_FAIL_STREAK_MAX} fallos de untag sin un éxito entremedio: el ACR no responde. Se abandona el barrido."
                fi
                return 0
              fi
            fi
            printf -- '- `%s`\n' "${full}:${tag}" >> "$DELETED_FILE"
          }
          export -f procesar_tag

          while IFS= read -r repo; do
            [[ -z "$repo" ]] && continue
            full="${PREFIX}/${repo}"
            echo "::group::Repo $full"

            # Una sola lectura ordenada por fecha: alimenta el conjunto
            # protegido y la aserción final.
            tags_desc=$(az acr repository show-tags -n "$ACR" --repository "$full" \
                          --orderby time_desc -o tsv 2>/dev/null || true)

            protected_file=$(mktemp)
            grep -E '^pr-[0-9]+-[0-9a-f]{7}$' <<< "$tags_desc" \
              | head -n "$KEEP_LAST_PR" >> "$protected_file" || true
            grep -E '^main-[0-9a-f]{7}$' <<< "$tags_desc" \
              | head -n "$KEEP_LAST_MAIN" >> "$protected_file" || true
            # Si ningún tag tiene la forma inmutable `pr-{N}-{sha7}` (p. ej. un
            # alias suelto que sobrevivió a un run antiguo), proteger igual el
            # `pr-*` más reciente: el piso es "una imagen pr-* por repositorio",
            # no "una con la forma canónica".
            if ! grep -qE '^pr-' "$protected_file"; then
              grep -m1 -E '^pr-' <<< "$tags_desc" >> "$protected_file" || true
            fi
            # Todo lo que un swarm tiene corriendo, sea `main-*`, `pr-*` o lo
            # que sea: si está desplegado, no se toca.
            #
            # El archivo trae `<repo>:<tag>`, no el tag suelto: dos servicios
            # distintos del mismo BC comparten el `main-<sha7>` del commit que
            # los construyó, así que sin el repositorio no se puede saber a cuál
            # pertenece. Acá se extraen los tags de ESTE repositorio, con
            # comparación de prefijo exacta (`index`), no regex: un punto en el
            # nombre del repositorio haría de comodín en un `sed`/`grep -E`.
            desplegado_repo=$(mktemp)
            awk -v r="${repo}:" 'index($0, r) == 1 { print substr($0, length(r) + 1) }' \
              "$desplegado_file" > "$desplegado_repo"
            if [[ -s "$desplegado_repo" ]]; then
              echo "  Desplegado en algún ambiente: $(tr '\n' ' ' < "$desplegado_repo")"
              grep -xF -f "$desplegado_repo" <<< "$tags_desc" >> "$protected_file" || true
            fi
            # Los alias mutables (`pr-{N}`, `main-latest`) apuntan al mismo
            # manifest que su inmutable, así que viajan con él.
            aliases=$(sed -E -n 's/^(pr-[0-9]+)-[0-9a-f]{7}$/\1/p' "$protected_file")
            [[ -n "$aliases" ]] && printf '%s\n' "$aliases" >> "$protected_file"
            grep -qxF 'main-latest' <<< "$tags_desc" \
              && echo 'main-latest' >> "$protected_file" || true

            if [[ -s "$protected_file" ]]; then
              echo "  Protegidos por retención: $(paste -sd' ' "$protected_file")"
            fi

            # Los `main-*` sólo son candidatos en modo barrido y con la poda
            # habilitada. El modo dirigido (cierre de PR, cleanup intra-PR) no
            # toca `main-*` nunca.
            if [[ -n "$PR_NUMBER" ]]; then
              tags=$(grep -E "^pr-${PR_NUMBER}(-.*)?$" <<< "$tags_desc" || true)
            elif (( poda_main == 1 )); then
              tags=$(grep -E "^pr-[0-9]+|^main-" <<< "$tags_desc" || true)
            else
              tags=$(grep -E "^pr-[0-9]+" <<< "$tags_desc" || true)
            fi

            # El bucle de tags va en paralelo: ver por qué es seguro en el
            # comentario de `procesar_tag`. El `set` va acá y no se hereda: las
            # opciones del shell no cruzan un `bash -c`. Sin `-e` a propósito —
            # un no-cero suelto no debe matar al worker a mitad de un tag y
            # dejarlo sin registrar; los errores se manejan explícitamente.
            export PROTECTED_FILE="$protected_file"
            printf '%s\n' "$tags" \
              | grep -v '^[[:space:]]*$' \
              | xargs -r -P "$UNTAG_PARALLELISM" -I{} \
                  bash -c 'set -uo pipefail; procesar_tag "$0" "$1"' "$full" {} \
              || true

            # El cortocircuito abandona el barrido entero, como hacía el
            # `break 2` de la versión secuencial. Se cierra el grupo primero,
            # que aquel se saltaba.
            if [[ -e "$circuit_file" ]]; then
              echo "::endgroup::"
              break
            fi

            # Purga de manifests huérfanos. Sólo en modo barrido: los modos
            # dirigidos (intra-PR, cierre de PR) corren en cada push y deben
            # ser rápidos. "Huérfano" es un manifest sin tags Y no referenciado
            # por ninguno etiquetado — todo el pipeline resuelve por tag y
            # descarta el digest (`${image%%@*}` en `_reusable-deploy-swarm.yml`).
            if [[ -z "$PR_NUMBER" ]]; then
              cutoff=$(( $(date +%s) - PURGE_UNTAGGED_AFTER_DAYS * 86400 ))

              # Digests que un manifest ETIQUETADO referencia. Las imágenes se
              # publican como índices OCI multi-plataforma: el tag apunta al
              # índice y sus manifests hijos NO llevan tag propio, así que un
              # filtro por `tags[0] == null` los ve como huérfanos aunque el
              # índice esté vivo y desplegado. Purgarlos rompería ese tag.
              #
              # Los fallos de resolución se registran en vez de tragarse. Un
              # `az acr manifest show` que falle —throttling del ACR, red, token
              # vencido a mitad del barrido— deja los hijos de ESE índice fuera
              # de la lista, y purgar con la lista incompleta borra por digest
              # los manifests de un tag vivo: irreversible, y silencioso hasta
              # que alguien necesite re-pull. Con la lista incompleta NO se purga.
              referenced_file=$(mktemp)
              refs_fail_file=$(mktemp)

              # Se relee el estado del repositorio: `tags_desc` es de ANTES del
              # bucle de untag y ya no describe la realidad. Resolver un tag que
              # este mismo run acaba de quitar falla siempre, se contabiliza como
              # fallo de resolución y la purga se salta — o sea que bastaba UN
              # untag para que la purga no corriera nunca más.
              if ! tags_vigentes=$(az acr repository show-tags -n "$ACR" --repository "$full" -o tsv 2>&1); then
                echo "::warning::$full: no se pudieron releer los tags tras el untag ($tags_vigentes). Purga de huérfanos OMITIDA en este repositorio."
                printf 'relectura-de-tags\n' >> "$refs_fail_file"
                tags_vigentes=""
              fi

              if [[ -n "$tags_vigentes" ]]; then
                grep -v '^$' <<< "$tags_vigentes" \
                  | xargs -r -P 6 -I{} bash -c '
                      if out=$(az acr manifest show -r "$0" -n "$1:$3" -o json 2>/dev/null); then
                        jq -r ".manifests[]?.digest" <<< "$out" 2>/dev/null \
                          || printf "%s\n" "$3" >> "$2"
                      elif ! az acr repository show-tags -n "$0" --repository "$1" -o tsv 2>/dev/null \
                             | grep -qxF "$3"; then
                        : # el tag ya no existe (carrera con otro run): no hay índice que proteger
                      else
                        printf "%s\n" "$3" >> "$2"
                      fi' \
                      "$ACR" "$full" "$refs_fail_file" {} \
                  >> "$referenced_file" || true
              fi

              if [[ -s "$refs_fail_file" ]]; then
                fail_n=$(wc -l < "$refs_fail_file" | tr -d ' ')
                echo "::warning::$full: no se pudo resolver el manifest de ${fail_n} tag(s) ($(paste -sd' ' "$refs_fail_file")). Purga de huérfanos OMITIDA en este repositorio: con la lista de digests referenciados incompleta, un hijo de un índice vivo se vería como huérfano y el borrado por digest es irreversible."
              else
                # Fase 1 — DECIDIR, secuencial. Barata (no hace red) y auditable:
                # cada descarte queda explicado en el log, en orden.
                purgar_file=$(mktemp)
                while IFS=$'\t' read -r digest updated; do
                  [[ -z "$digest" ]] && continue
                  if grep -qxF "$digest" "$referenced_file"; then
                    echo "  Skip huérfano ${digest:0:19}… (hijo de un índice etiquetado)"
                    continue
                  fi
                  # Al revés que arriba: si la fecha no parsea, NO se borra.
                  upd_epoch=$(date -d "$updated" +%s 2>/dev/null || echo "")
                  if [[ -z "$upd_epoch" ]]; then
                    echo "  Skip huérfano ${digest:0:19}… (lastUpdateTime '$updated' no parseable)"
                    continue
                  fi
                  (( upd_epoch > cutoff )) && continue
                  printf '%s\n' "$digest" >> "$purgar_file"
                done < <(az acr manifest list-metadata -r "$ACR" -n "$full" --orderby time_desc \
                           --query "[?tags[0] == null].[digest, lastUpdateTime]" -o tsv 2>/dev/null || true)

                # Fase 2 — BORRAR, en paralelo. Es el 85% del tiempo del job:
                # 1047 purgas secuenciales a ~1.5 s cada una consumieron 26 de
                # los 30 minutos del timeout en el primer barrido real de cont,
                # que murió sin terminar. El borrado es independiente entre
                # manifests, así que paralelizarlo no cambia ninguna decisión:
                # la fase 1 ya decidió qué se borra y por qué.
                #
                # Menos paralelismo que el recorrido de referenciados (6): este
                # bucle BORRA, y saturar el ACR acá cuesta más que ir lento.
                n_purgar=$(wc -l < "$purgar_file" | tr -d ' ')
                if (( n_purgar > 0 )); then
                  if [[ "$DRY_RUN" == "true" ]]; then
                    sed "s|^|  [DRY-RUN] purgaría huérfano: ${full}@|" "$purgar_file"
                    purged_count=$(( purged_count + n_purgar ))
                  else
                    echo "  Purgando $n_purgar manifests huérfanos (paralelismo $PURGE_PARALLELISM)…"
                    purga_fail_file=$(mktemp)
                    xargs -r -P "$PURGE_PARALLELISM" -I{} bash -c '
                        az acr repository delete -n "$0" --image "$1@$3" --yes >/dev/null 2>&1 \
                          || printf "%s\n" "$3" >> "$2"' \
                        "$ACR" "$full" "$purga_fail_file" {} < "$purgar_file" || true
                    n_fail=$(wc -l < "$purga_fail_file" | tr -d ' ')
                    purged_count=$(( purged_count + n_purgar - n_fail ))
                    echo "  Purgados $(( n_purgar - n_fail )) de $n_purgar"
                    if (( n_fail > 0 )); then
                      # Un borrado que falla no pierde nada: el manifest sigue
                      # ahí y el barrido siguiente lo reintenta. Por eso avisa
                      # en vez de fallar el job.
                      echo "::warning::$full: $n_fail de $n_purgar manifests huérfanos no se pudieron purgar. No hay pérdida de datos; se reintentan en el barrido siguiente."
                    fi
                  fi
                fi
              fi
            fi

            # Aserción: el conjunto protegido sobrevivió de hecho, no sólo de
            # intención. Con la poda de `main-*` activa ya no sirve comparar
            # recuentos —que bajen es lo esperado—, así que se verifica tag por
            # tag. Falla el job en vez de dejar un ambiente sin su imagen.
            if [[ "$DRY_RUN" != "true" ]]; then
              tags_after=$(az acr repository show-tags -n "$ACR" --repository "$full" -o tsv 2>/dev/null || true)
              perdidos=$(sort -u "$protected_file" | grep -vxF -f <(printf '%s\n' "$tags_after") || true)
              if [[ -n "$perdidos" ]]; then
                echo "::error::$full perdió tags protegidos durante el cleanup: $(tr '\n' ' ' <<< "$perdidos")"
                exit 1
              fi
              if grep -qE '^pr-' <<< "$tags_desc" && ! grep -qE '^pr-' <<< "$tags_after"; then
                echo "::error::$full tenía tags pr-* y quedó sin ninguno tras el cleanup."
                exit 1
              fi
            fi
            echo "::endgroup::"
          done <<< "$REPOS"
          # El recuento sale del archivo: un contador en memoria no sobrevive
          # a los subshells de `xargs -P`.
          deleted_count=$(wc -l < "$deleted_file" | tr -d ' ')

          echo "count=$deleted_count" >> "$GITHUB_OUTPUT"
          echo "purged=$purged_count" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            cat "$deleted_file" 2>/dev/null || true
            echo "EOF"
            echo "untag_failed<<EOF"
            cat "$untag_fail_file" 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # El job falla DESPUÉS de haber barrido todo lo que sí se pudo y de
          # haber publicado los outputs, para que el resumen quede completo.
          if [[ -s "$untag_fail_file" ]]; then
            echo "::error::$(wc -l < "$untag_fail_file" | tr -d ' ') tag(s) no se pudieron untaggear; el resto del barrido sí se completó ($deleted_count tags eliminados, $purged_count manifests purgados):"
            sed 's/^/  - /' "$untag_fail_file"
            exit 1
          fi

      - name: Resumen
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          COUNT: ${{ steps.cleanup.outputs.count || 0 }}
          PURGED: ${{ steps.cleanup.outputs.purged || 0 }}
          DETAIL: ${{ steps.cleanup.outputs.list }}
          UNTAG_FAILED: ${{ steps.cleanup.outputs.untag_failed }}
          KEEP_LAST_PR: ${{ inputs.keep_last_pr }}
          KEEP_LAST_MAIN: ${{ inputs.keep_last_main }}
          PODA_MAIN: ${{ inputs.runner_group_prod != '' }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            mode="PR #$PR_NUMBER"
          else
            mode="Barrido (PRs cerrados >$MIN_AGE_DAYS días)"
          fi
          {
            echo "## Cleanup ACR"
            echo ""
            echo "- Modo: $mode"
            echo "- Dry-run: \`$DRY_RUN\`"
            echo "- Retención: últimas \`$KEEP_LAST_PR\` \`pr-*\` + últimas \`$KEEP_LAST_MAIN\` \`main-*\` por repositorio, más todo lo desplegado en dev y prod"
            if [[ "$PODA_MAIN" == "true" ]]; then
              echo "- Poda de \`main-*\`: **activa** (excluye lo desplegado en ambos swarms)"
            else
              echo "- Poda de \`main-*\`: inactiva (el caller no declara \`runner_group_prod\`)"
            fi
            echo "- Tags eliminados: **$COUNT**"
            echo "- Manifests huérfanos purgados: **$PURGED**"
            if [[ -n "$DETAIL" ]]; then
              echo ""
              echo "### Detalle"
              echo "$DETAIL"
            fi
            if [[ -n "$UNTAG_FAILED" ]]; then
              echo ""
              echo "### Tags que no se pudieron untaggear"
              echo ""
              echo "Fallaron los 3 intentos. El resto del barrido sí se completó; estos se reintentan en la corrida siguiente."
              echo ""
              while IFS= read -r t; do
                [[ -n "$t" ]] && echo "- \`$t\`"
              done <<< "$UNTAG_FAILED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
