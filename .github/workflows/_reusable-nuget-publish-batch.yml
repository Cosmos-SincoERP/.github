name: NuGet publish batch (reusable)

# Estándar de release NuGet del org: versionado LOCKSTEP. Publica TODOS los
# paquetes listados en el catálogo del repo llamante con UNA misma versión por
# release (un solo tag `<tag_prefix><X>`), empaquetando en paralelo.
#
# Por qué lockstep: como todos los paquetes comparten la versión X, las
# dependencias internas entre ellos se resuelven solas (todas apuntan a X) y el
# pack con `-p:Version=X` (propiedad global) es correcto. Así se elimina la carga
# operativa de mantener versiones de dependencias internas (no se necesitan anclas
# tipo Directory.Build.targets). Es la base para todos los repos de paquetes NuGet.
#
# El repo llamante solo aporta:
#   - un catálogo `.github/paquetes-nuget.yml` (lista de `.paquetes[].project_path`),
#   - un caller mínimo que invoca este reusable (ver README).
#
# Sin `concurrency` aquí: la declara el caller (compartir el grupo entre caller y
# reusable provoca un deadlock que GitHub cancela).

on:
  workflow_call:
    inputs:
      bump_type:
        description: "patch | minor | major. Deriva la versión del último tag. Ignorado si se da 'version'."
        type: string
        required: false
        default: "minor"
      version:
        description: "Versión explícita X.Y.Z. Obligatoria en el primer release (aún no hay tag)."
        type: string
        required: false
        default: ""
      tag_prefix:
        description: "Prefijo del tag de versión del repo. Default 'v' → v1.2.3."
        type: string
        required: false
        default: "v"
      catalog_path:
        description: "Ruta al catálogo de paquetes publicables (YAML con .paquetes[].project_path)."
        type: string
        required: false
        default: ".github/paquetes-nuget.yml"
      nuget_source:
        description: "Feed destino del push."
        type: string
        required: false
        default: "https://api.nuget.org/v3/index.json"
      global_json:
        description: "Ruta al global.json para setup-dotnet."
        type: string
        required: false
        default: "global.json"
      create_github_release:
        description: "Crear un GitHub Release del tag con notas autogeneradas."
        type: boolean
        required: false
        default: true
      release_ref:
        description: "Ref git desde el cual se permite liberar."
        type: string
        required: false
        default: "refs/heads/main"
    secrets:
      NUGET_API_KEY:
        description: "API key con permiso de push al feed."
        required: true
    outputs:
      version:
        description: "Versión publicada (sin prefijo)."
        value: ${{ jobs.resolver.outputs.version }}
      tag:
        description: "Tag creado (tag_prefix + versión)."
        value: ${{ jobs.resolver.outputs.tag }}

permissions:
  contents: read

jobs:
  resolver:
    name: Calcular versión y crear tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      projects_json: ${{ steps.calc.outputs.projects_json }}
    steps:
      - name: Validar ref de origen
        shell: bash
        env:
          REF: ${{ github.ref }}
          ALLOWED: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "$ALLOWED" ]]; then
            echo "::error::Release permitido solo desde '$ALLOWED'. Recibido: $REF"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcular versión, proyectos y tag
        id: calc
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          VERSION_INPUT: ${{ inputs.version }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          CATALOG: ${{ inputs.catalog_path }}
        run: |
          set -euo pipefail

          if [[ ! -f "$CATALOG" ]]; then
            echo "::error::Catálogo no encontrado: $CATALOG"
            exit 1
          fi
          projects=$(yq -o=json '.paquetes' "$CATALOG" | jq -c '[.[].project_path]')
          n=$(echo "$projects" | jq 'length')
          if [[ "$n" -eq 0 ]]; then
            echo "::error::El catálogo '$CATALOG' no lista paquetes."
            exit 1
          fi

          if [[ -n "$VERSION_INPUT" ]]; then
            new="$VERSION_INPUT"
            if [[ ! "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version inválida: '$new'. Formato esperado: X.Y.Z"
              exit 1
            fi
          else
            last=$(git tag -l "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1 || true)
            if [[ -z "$last" ]]; then
              echo "::error::No hay tags '${TAG_PREFIX}*' (primer release). Indica el input 'version' (ej. 1.0.0)."
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$last"
            case "$BUMP_TYPE" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "::error::bump_type inválido: $BUMP_TYPE"; exit 1 ;;
            esac
            new="${major}.${minor}.${patch}"
          fi

          tag="${TAG_PREFIX}${new}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::warning::El tag ${tag} ya existe — modo reintento (no se recrea el tag)."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release ${tag} (lockstep)"
            git push origin "$tag"
          fi

          {
            echo "version=${new}"
            echo "tag=${tag}"
            echo "projects_json=${projects}"
          } >> "$GITHUB_OUTPUT"
          echo "Versión: ${new}  (tag ${tag})  —  ${n} paquetes"

      - name: Crear GitHub Release
        if: ${{ inputs.create_github_release }}
        shell: bash
        env:
          TAG: ${{ steps.calc.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ya existe; no se recrea."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  publish:
    name: Pack & push
    needs: resolver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.resolver.outputs.projects_json) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ inputs.global_json }}

      - name: Pack
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ needs.resolver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -f "$PROJECT" ]]; then
            echo "::error::Proyecto no encontrado: $PROJECT"
            exit 1
          fi
          # -p:Version (no -p:PackageVersion): bajo lockstep es la misma X para todos,
          # así la propagación a dependencias internas es correcta, y fija también
          # PackageVersion y FileVersion (vía Directory.Build.props) a la versión real.
          dotnet pack "$PROJECT" \
            -c Release \
            -p:Version="$VERSION" \
            -o ./nupkgs

      - name: Push
        shell: bash
        env:
          NUGET_SOURCE: ${{ inputs.nuget_source }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./nupkgs/*.nupkg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No se generaron .nupkg"
            exit 1
          fi
          for pkg in "${files[@]}"; do
            echo "  Push: $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Resumen
        if: always()
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ needs.resolver.outputs.version }}
        run: |
          echo "### \`$PROJECT\` → \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
