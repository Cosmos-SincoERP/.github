name: npm publish (reusable)

# Publica una librería npm del org. NO versiona: el bump de versión (changeset
# version / edición manual de package.json) se hace en el PR del cambio, no acá.
# Este workflow solo PUBLICA la versión vigente de `main` con `changeset publish`,
# que es idempotente (si la versión ya existe en el registro, no hace nada).
#
# Registro destino (input `npm_registry`):
#   - npm público:    https://registry.npmjs.org   -> auth con secret NPM_TOKEN
#   - GitHub Packages: https://npm.pkg.github.com   -> auth con el GITHUB_TOKEN del
#     workflow (no requiere NPM_TOKEN). El scope DEBE ser el nombre del org en
#     minúsculas (@cosmos-sincoerp) y el caller debe conceder `permissions: packages: write`.
#
# El control de concurrencia lo declara el workflow LLAMANTE, no este reusable
# (compartir `concurrency.group` entre caller y reusable provoca un deadlock).

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directorio del package.json (relativo al checkout)."
        type: string
        required: false
        default: "."
      bun_version:
        description: "Versión de Bun a instalar."
        type: string
        required: false
        default: "latest"
      npm_registry:
        description: "Registro destino: https://registry.npmjs.org (npm público) o https://npm.pkg.github.com (GitHub Packages)."
        type: string
        required: false
        default: "https://registry.npmjs.org"
      publish_command:
        description: "Comando que buildea y publica (por defecto build + changeset publish)."
        type: string
        required: false
        default: "bun run release"
    secrets:
      NPM_TOKEN:
        description: "Token de publish. Requerido solo para registros que no sean GitHub Packages (npm público). Para GitHub Packages se usa el GITHUB_TOKEN del workflow."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publicar a ${{ inputs.npm_registry }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun ${{ inputs.bun_version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Cache de Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working_directory)) }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Configurar auth del registro
        shell: bash
        env:
          NPM_REGISTRY: ${{ inputs.npm_registry }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host="${NPM_REGISTRY#http*://}"
          host="${host%/}"
          # GitHub Packages: autentica con el GITHUB_TOKEN del workflow.
          # Otros registros (npm público): requieren NPM_TOKEN.
          if [ "$host" = "npm.pkg.github.com" ]; then
            token="$GITHUB_TOKEN"
          else
            token="${NPM_TOKEN:-}"
            if [ -z "$token" ]; then
              echo "::error::El registro $NPM_REGISTRY requiere el secret NPM_TOKEN."
              exit 1
            fi
          fi
          {
            printf '//%s/:_authToken=%s\n' "$host" "$token"
            printf 'registry=%s\n' "$NPM_REGISTRY"
          } > "$HOME/.npmrc"

      - name: Publicar (idempotente)
        shell: bash
        env:
          PUBLISH_COMMAND: ${{ inputs.publish_command }}
        run: |
          set -euo pipefail
          # changeset publish solo sube versiones que aún no existen en el registro.
          eval "$PUBLISH_COMMAND"

      - name: Resumen
        if: always()
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
          REGISTRY: ${{ inputs.npm_registry }}
        run: |
          {
            echo "## npm publish"
            echo ""
            echo "- Directorio: \`$WD\`"
            echo "- Registro: \`$REGISTRY\`"
            echo "- Publica la versión vigente de \`main\` (idempotente con changeset publish)."
            echo "- El bump de versión se hace en el PR del cambio, no en este workflow."
          } >> "$GITHUB_STEP_SUMMARY"
