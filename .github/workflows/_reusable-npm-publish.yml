name: npm publish (reusable)

# Publica una librería npm del org usando Changesets.
# - Push a main con changesets pendientes  -> abre/actualiza el PR "Version Packages".
# - Merge del PR "Version Packages"          -> publica el/los paquete(s) a npm.
# El consumidor lo invoca desde un workflow `on: push: branches: [main]`.
# Requiere el secret NPM_TOKEN (automation token del registro destino).
#
# El control de concurrencia lo declara el workflow LLAMANTE, no este reusable:
# si ambos comparten `concurrency.group` (p. ej. `release-${{ github.workflow }}`,
# que en el reusable resuelve al nombre del caller), GitHub detecta un deadlock
# entre el top-level workflow y el reusable y cancela el run.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directorio del package.json / .changeset (relativo al checkout)."
        type: string
        required: false
        default: "."
      bun_version:
        description: "Versión de Bun a instalar."
        type: string
        required: false
        default: "latest"
      npm_registry:
        description: "Registro npm destino. Default: npm público."
        type: string
        required: false
        default: "https://registry.npmjs.org"
      version_command:
        description: "Comando que aplica los changesets (bump + CHANGELOG)."
        type: string
        required: false
        default: "bun run version-packages"
      publish_command:
        description: "Comando que buildea y publica (changeset publish)."
        type: string
        required: false
        default: "bun run release"
    secrets:
      NPM_TOKEN:
        description: "Automation token con permiso de publish al registro."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets (version PR / publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun ${{ inputs.bun_version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Cache de Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working_directory)) }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Configurar auth de npm
        shell: bash
        env:
          NPM_REGISTRY: ${{ inputs.npm_registry }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          host="${NPM_REGISTRY#http*://}"
          host="${host%/}"
          printf '//%s/:_authToken=%s\n' "$host" "$NPM_TOKEN" > "$HOME/.npmrc"
          printf 'registry=%s\n' "$NPM_REGISTRY" >> "$HOME/.npmrc"

      # Réplica de changesets/action SIN acciones de terceros (la política del org
      # solo admite acciones de GitHub, verified o Cosmos-SincoERP/*). Usa el CLI de
      # changesets (devDependency) + git + gh (ambos provistos por GitHub).
      #  - Hay changesets pendientes  -> bump en una rama y abre/actualiza el "Version Packages" PR.
      #  - No hay changesets pendientes -> publica (build + changeset publish) y empuja los tags.
      - name: Changesets (version PR o publish)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION_COMMAND: ${{ inputs.version_command }}
          PUBLISH_COMMAND: ${{ inputs.publish_command }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ¿Hay changesets pendientes? (cualquier .changeset/*.md salvo el README)
          pending=()
          shopt -s nullglob
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            pending+=("$f")
          done

          if [ ${#pending[@]} -gt 0 ]; then
            echo "::group::Version mode (${#pending[@]} changeset(s) pendientes)"
            release_branch="changeset-release/${BASE_BRANCH}"
            git checkout -B "$release_branch"

            eval "$VERSION_COMMAND"   # bump de package.json + CHANGELOG + consume los changesets

            if git diff --quiet; then
              echo "version-packages no produjo cambios; nada que abrir."
              echo "::endgroup::"
              exit 0
            fi

            git add -A
            git commit -m "chore(release): versionar paquetes"
            git push -f origin "$release_branch"

            if gh pr view "$release_branch" --json number >/dev/null 2>&1; then
              echo "El PR \"Version Packages\" ya existe; el push lo actualizó."
            else
              gh pr create \
                --base "$BASE_BRANCH" \
                --head "$release_branch" \
                --title "chore(release): versionar paquetes" \
                --body $'PR generado automáticamente por el release.\n\nAplica los changesets pendientes: sube la versión en `package.json` y actualiza el `CHANGELOG.md`.\n\nAl mergear este PR se publica el paquete a npm.'
            fi
            echo "::endgroup::"
          else
            echo "::group::Publish mode (sin changesets pendientes)"
            eval "$PUBLISH_COMMAND"   # build + changeset publish (crea tags locales)
            git push origin --tags || true
            echo "::endgroup::"
          fi

      - name: Resumen
        if: always()
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
          REGISTRY: ${{ inputs.npm_registry }}
        run: |
          {
            echo "## npm publish (Changesets)"
            echo ""
            echo "- Directorio: \`$WD\`"
            echo "- Registro: \`$REGISTRY\`"
            echo "- Con changesets pendientes -> se abrió/actualizó el PR \"Version Packages\"."
            echo "- Sin changesets -> se publicó la versión vigente."
          } >> "$GITHUB_STEP_SUMMARY"
