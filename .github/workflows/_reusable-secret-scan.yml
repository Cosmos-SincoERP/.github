name: Secret Scan (trufflehog)

# Reusable que ejecuta TruffleHog OSS contra el código del repo consumidor.
# Mitigación open-source de secret scanning para repos privados sin GHAS.
# Combinado con B.12 (push rulesets) cubre la brecha. Referencia: ADR 0002
# decisión E.6 (apéndice A3).
#
# Reemplaza gitleaks-action (no aplicable: requiere licencia comercial para
# organizaciones desde v2). TruffleHog OSS es verified creator y no requiere
# licencia. La flag --only-verified filtra falsos positivos validando los
# secrets detectados con el provider (AWS, Azure, GitHub, etc.).
#
# Pinear por SHA exacto porque TruffleHog no publica tag mayor móvil (@v3),
# solo tags específicos por versión (@v3.95.3). Dependabot github-actions
# ecosystem mantiene la SHA actualizada.

on:
  workflow_call:
    inputs:
      base:
        description: "Ref base para el diff (default: rama default del repo)."
        type: string
        default: ""
      extra-args:
        description: "Argumentos adicionales para TruffleHog (default: --only-verified)."
        type: string
        default: "--only-verified"

permissions:
  contents: read
  pull-requests: write

# Sin `concurrency:` a nivel workflow: github.job es `null` a nivel workflow
# (no se evalúa fuera de un step), produciendo group idéntico entre reusables
# del mismo caller. Como este check es read-only y rápido, no necesita
# cancel-in-progress.

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # GitHub-owned → tag mayor (D.3)
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          base: ${{ inputs.base || format('refs/heads/{0}', github.event.repository.default_branch) }}
          head: HEAD
          extra_args: ${{ inputs.extra-args }}
