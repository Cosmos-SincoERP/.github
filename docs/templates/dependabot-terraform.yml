# Cambios locales se sobrescriben por el sync workflow.
# Para personalizar: editar el template fuente o añadir override al manifest.
# El token {{ terraform_directory }} se sustituye por el sync con el valor de
# overrides.terraform_directory en el manifest (default: "/").
# ─────────────────────────────────────────────────────────────────
version: 2
updates:
  # Ajustar `directory` al subdir donde viven los .tf (típicamente /infra,
  # /infraestructura, etc.). El default "/" rara vez aplica.
  - package-ecosystem: "terraform"
    directory: "{{ terraform_directory | default('/') }}"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
