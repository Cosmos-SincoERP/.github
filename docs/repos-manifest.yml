# ─────────────────────────────────────────────────────────────────
# Repos governed by the .github sync workflows.
#
# Source of verdad: repos en la org Cosmos-SincoERP que consumen
# `dependabot.yml`, `security-checks.yml` y/o `_reusable-*.yml`
# desde este repo.
#
# Editar este archivo es la forma de onboarding/offboarding del sync.
# Stack determina cuál template de dependabot se propaga.
# `consumes` permite opt-out parcial (ej. solo dependabot, sin reusables).
# `overrides` permite personalización mínima documentada por repo.
#
# Overrides soportados:
#   terraform_directory: string  — path del subdir con .tf (default "/")
#   docker_directories:  list    — paths con Dockerfiles a trackear por
#                                  Dependabot (genera un bloque docker en
#                                  el dependabot.yml propagado)
#
# Ver Pieza 1 del plan: docs/adr/0002 §E.3 (managed sync).
# ─────────────────────────────────────────────────────────────────

repos:

  # creado por golden path (arquetipo infra)
  - name: Cosmos.SbxInfra
    stack: terraform
    consumes: [reusables, dependabot]
    overrides:
      terraform_directory: /infra
  # ── BuildingBlocks / librerías .NET ─────────────────────────────
  - name: Cosmos.BuildingBlocks
    stack: dotnet
    consumes: [reusables, dependabot]
    # Sin Dockerfiles: librería pura, no se containeriza.

  - name: Cosmos.CrossCuttingConcerns
    stack: dotnet
    consumes: [reusables, dependabot]
    # Sin Dockerfiles: librerías puras.

  - name: Cosmos.Types
    stack: dotnet
    consumes: [reusables, dependabot]
    # Sin Dockerfiles: librería pura.

  # ── ApplicationPlane (orquestador del plane) ────────────────────
  - name: ApplicationPlane
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /src/Gateway/ApplicationPlane.Gateway

  - name: ApplicationPlane.Infraestructura
    stack: terraform
    consumes: [reusables, dependabot]
    overrides:
      terraform_directory: /infra

  # ── ControlPlanes ───────────────────────────────────────────────
  - name: ControlPlane
    stack: dotnet
    consumes: [reusables, dependabot]
    # Dockerfiles a confirmar; sin override por ahora.

  - name: ObligacionesPorPagar.ControlPlane
    stack: dotnet
    consumes: [reusables, dependabot]
    # Dockerfiles a confirmar; sin override por ahora.

  # ── Asistente ───────────────────────────────────────────────────
  - name: Cosmos.Asistente
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /Cosmos.Asistente.Comandos.API
        - /Cosmos.Asistente.Consultas.API

  - name: Cosmos.Asistente.Front
    stack: node-bun
    consumes: [reusables, dependabot]
    # Sin Dockerfile aún; añadir docker_directories cuando exista.

  - name: Cosmos.Front.Shell
    stack: node-bun
    consumes: [reusables, dependabot]
    # Sin Dockerfile aún; añadir docker_directories cuando exista.

  # ── Contabilidad ────────────────────────────────────────────────
  - name: Cosmos.Contabilidad
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /Cosmos.Contabilidad.Comandos.API
        - /Cosmos.Contabilidad.Comandos.MCP.Server
        - /Cosmos.Contabilidad.Consultas.API
        - /Cosmos.Contabilidad.Consultas.MCP.Server

  - name: Cosmos.Contabilidad.Gateway
    stack: github-actions
    consumes: [reusables, dependabot]
    # Gateway empaquetado como Docker (nginx); sin código .NET propio.
    overrides:
      docker_directories:
        - /

  - name: Cosmos.Contabilidad.Front
    stack: node-bun
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /

  - name: Cosmos.Contabilidad.Infraestructura
    stack: terraform
    consumes: [reusables, dependabot]
    overrides:
      terraform_directory: /infra
      # Sin Dockerfiles: solo IaC.

  # ── Impuestos ───────────────────────────────────────────────────
  - name: Cosmos.Impuestos
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /Cosmos.Impuestos.Comandos.API
        - /Cosmos.Impuestos.Comandos.Grpc
        - /Cosmos.Impuestos.Consultas.API
        - /Cosmos.Impuestos.Consultas.Grpc
        - /Cosmos.Impuestos.Seed

  - name: Cosmos.Impuestos.Gateway
    stack: github-actions
    consumes: [reusables, dependabot]
    # Gateway empaquetado como Docker (nginx); sin código .NET propio.
    overrides:
      docker_directories:
        - /

  - name: Cosmos.Impuestos.Front
    stack: node-bun
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /

  - name: Cosmos.Impuestos.Infraestructura
    stack: terraform
    consumes: [reusables, dependabot]
    overrides:
      terraform_directory: /infra

  # ── ObligacionesPorPagar ────────────────────────────────────────
  - name: ObligacionesPorPagar.Entradas
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /ObligacionesPorPagar.Entradas.API

  - name: ObligacionesPorPagar.Gateway
    stack: github-actions
    consumes: [reusables, dependabot]
    # Gateway empaquetado como Docker (nginx); sin código .NET propio.
    overrides:
      docker_directories:
        - /

  - name: ObligacionesPorPagar.Front
    stack: node-bun
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /

  - name: ObligacionesPorPagar.Infraestructura
    stack: terraform
    consumes: [reusables, dependabot]
    overrides:
      terraform_directory: /infra

  - name: ObligacionesPorPagar.Notificaciones
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /ObligacionesPorPagar.Notificaciones.Server

  - name: ObligacionesPorPagar.Radicacion
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /ObligacionesPorPagar.Radicacion.Comandos.API
        - /ObligacionesPorPagar.Radicacion.Comandos.MCP.Server
        - /ObligacionesPorPagar.Radicacion.Consultas.API
        - /ObligacionesPorPagar.Radicacion.Consultas.MCP.Server
        - /ObligacionesPorPagar.Radicacion.PaymentPolling

  - name: ObligacionesPorPagar.Reconocimiento
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /ObligacionesPorPagar.Reconocimiento.Comandos.API
        - /ObligacionesPorPagar.Reconocimiento.Comandos.MCP.Server
        - /ObligacionesPorPagar.Reconocimiento.Consultas.API
        - /ObligacionesPorPagar.Reconocimiento.Consultas.MCP.Server

  - name: ObligacionesPorPagar.Integraciones
    stack: dotnet
    consumes: [reusables, dependabot]
    # Dockerfiles a confirmar.

  # ── Terceros ────────────────────────────────────────────────────
  - name: Cosmos.Terceros
    stack: dotnet
    consumes: [reusables, dependabot]
    overrides:
      docker_directories:
        - /Cosmos.Terceros.Comandos.API
        - /Cosmos.Terceros.Consultas.API

  # ── Repos placeholder / docs / templates ────────────────────────
  # Solo necesitan baseline (security-checks vía reusables + dependabot
  # github-actions). Sin código de aplicación aún, o solo docs/diagrams.

  - name: Cosmos.Direcciones
    stack: github-actions
    consumes: [reusables, dependabot]

  - name: Cosmos.DatosReferencia
    stack: github-actions
    consumes: [reusables, dependabot]

  - name: Cosmos.Terceros.Front
    stack: github-actions
    consumes: [reusables, dependabot]

  - name: blog-ingenieria
    stack: github-actions
    consumes: [reusables, dependabot]
    # Jekyll/Ruby (Gemfile presente). Dependabot ruby no está cubierto
    # por nuestros templates; se mantiene solo github-actions.

  - name: architecture
    stack: github-actions
    consumes: [reusables, dependabot]

  - name: erp-definiciones
    stack: github-actions
    consumes: [reusables, dependabot]

  - name: template-progressive-tdd-katas
    stack: github-actions
    consumes: [reusables, dependabot]

# ─────────────────────────────────────────────────────────────────
# Opt-out explícito. Repos en la org que NO entran al sync.
# Cada entrada requiere `reason:` justificando.
# ─────────────────────────────────────────────────────────────────
skip:
  - name: Cosmos.AgentSkills
    reason: "ex-Cosmos.PlatformWorkflows; ahora es repo fuente de skills/tooling, governance se redefine aparte"

  - name: Observabilidad
    reason: "repo vacío (size=0, sin commits); sync no puede clonar. Reclasificar a repos: cuando tenga contenido y stack identificable"
