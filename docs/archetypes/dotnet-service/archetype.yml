# Arquetipo: dotnet-service
# Servicio .NET de negocio (típicamente CQRS: Comandos/Consultas), containerizado
# y desplegado a Docker Swarm. Ver docs/archetypes/README.md para el esquema.
description: "Servicio .NET de negocio (CQRS), containerizado, deploy a Swarm."
stack: dotnet
consumes: [reusables, dependabot]
bc_key_required: true

# Sin docker_directories al crear: el repo nace sin Dockerfiles (el equipo añade
# los proyectos y sus Dockerfiles). El override se llena cuando el código aterriza
# (vía scan-repo.sh o lo reporta el drift-check). El CI/CD (wrappers, imagenes-docker.yml,
# stack.dev.yml) lo agrega la skill /onboard-dotnet-repo una vez existe la infra del BC.
overrides: {}

# Contextos EXACTOS de los checks, en formato `<job-caller> / <job-del-reusable>`
# (confirmado en PR #89). Al crear, el repo solo trae los workflows de seguridad
# (security-checks.yml gestionado); el CI/CD .NET (tests, build, deploy) lo agrega
# /onboard-dotnet-repo más tarde, así que `tests / tests` no se marca required al crear.
required_checks:
  - "dependency-review / trivy"
  - "secret-scan / trufflehog"
