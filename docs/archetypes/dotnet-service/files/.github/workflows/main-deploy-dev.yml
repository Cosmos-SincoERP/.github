name: main · build, push & deploy (dev)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-deploy-dev
  cancel-in-progress: false

jobs:
  resolver:
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.read.outputs.images_json }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: echo "images_json=$(yq -o=json '.imagenes' .github/imagenes-docker.yml | jq -c .)" >> "$GITHUB_OUTPUT"

  tests:
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-tests-dotnet.yml@v1

  docker:
    needs: [resolver, tests]
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-docker-build-push.yml@v1
    with:
      images_json: ${{ needs.resolver.outputs.images_json }}
      acr_name: cr{{BC_KEY}}deveus2001
      repository_prefix: {{BC_KEY}}
      buildx_builder_name: {{BC_KEY}}-builder

  deploy:
    needs: docker
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-deploy-swarm.yml@v1
    with:
      # TODO({{REPO_NAME}}): confirmar stack_name y la lista de secret_names del KV.
      stack_file: deploy/stack.dev.yml
      stack_name: {{BC_KEY}}-{{REPO_NAME}}
      image_tags_json: ${{ needs.docker.outputs.image_tags_json }}
      acr_name: cr{{BC_KEY}}deveus2001
      repository_prefix: {{BC_KEY}}
      key_vault_name: kv-{{BC_KEY}}-dev-eus2-001
      swarm_secret_prefix: {{BC_KEY}}
      stack_environment: dev
