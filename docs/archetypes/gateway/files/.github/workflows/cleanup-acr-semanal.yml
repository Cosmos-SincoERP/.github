name: Cleanup ACR · barrido semanal

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Listar sin borrar'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-cleanup-acr-pr.yml@v1
    with:
      acr_name: cr{{BC_KEY}}deveus2001
      repository_prefix: {{BC_KEY}}
      min_age_days: 7
      dry_run: ${{ inputs.dry_run || false }}
