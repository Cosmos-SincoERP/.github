# Config nginx placeholder del gateway {{BC_KEY}}.
# TODO({{REPO_NAME}}): definir upstreams y rutas reales hacia los servicios del BC.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server {
    listen 8080;

    location /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # location /api/ { proxy_pass http://servicio-interno:8080/; }
  }
}
