# Arquetipo: dotnet-library-nuget
# Librería .NET pura publicada como paquete NuGet. Sin Docker, sin deploy.
# Ver docs/archetypes/README.md para el esquema.
description: "Librería .NET publicada a NuGet (sin Docker, sin deploy)."
stack: dotnet
consumes: [reusables, dependabot]
# NuGet publica a nuget.org con package_id; no requiere clave de bounded context.
bc_key_required: false

overrides: {}

# Contextos en formato `<job-caller> / <job-del-reusable>`. El wrapper `pr-tests.yml`
# de este arquetipo define el job `tests` que llama a `_reusable-tests-dotnet.yml`,
# cuyo job se llama "dotnet build & test" → GitHub publica "tests / dotnet build & test".
# (Verificado contra el primer PR real de Cosmos.Storage; antes decía "tests / tests"
# y dejaba el ruleset esperando un contexto que nunca reportaba.)
required_checks:
  - "tests / dotnet build & test"
  - "dependency-review / trivy"
  - "secret-scan / trufflehog"
