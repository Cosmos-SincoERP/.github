name: Release · NuGet

# Disparo manual: calcula SemVer, crea tag + Release y publica el paquete.
# bump-and-tag y nuget-publish se encadenan en el mismo run (un tag creado con
# GITHUB_TOKEN no dispara otros workflows).

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Paquete a publicar'
        type: choice
        default: principal
        options:
          - principal
          # TODO({{REPO_NAME}}): añadir más paquetes si el repo publica varios.
      bump_type:
        description: 'Tipo de bump SemVer'
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  resolver:
    runs-on: ubuntu-latest
    outputs:
      package_id: ${{ steps.map.outputs.package_id }}
      tag_prefix: ${{ steps.map.outputs.tag_prefix }}
      project_path: ${{ steps.map.outputs.project_path }}
    steps:
      - id: map
        # TODO({{REPO_NAME}}): mapear cada `package` a su package_id, tag_prefix y project_path.
        run: |
          case "${{ inputs.package }}" in
            principal)
              echo "package_id={{REPO_NAME}}"                 >> "$GITHUB_OUTPUT"
              echo "tag_prefix=v"                             >> "$GITHUB_OUTPUT"
              echo "project_path=src/{{REPO_NAME}}/{{REPO_NAME}}.csproj" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::paquete desconocido"; exit 1 ;;
          esac

  bump-and-tag:
    needs: resolver
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-bump-and-tag.yml@v1
    with:
      package_id: ${{ needs.resolver.outputs.package_id }}
      tag_prefix: ${{ needs.resolver.outputs.tag_prefix }}
      bump_type: ${{ inputs.bump_type }}
      create_github_release: true

  publish:
    needs: [resolver, bump-and-tag]
    uses: Cosmos-SincoERP/.github/.github/workflows/_reusable-nuget-publish.yml@v1
    with:
      project_path: ${{ needs.resolver.outputs.project_path }}
      package_version: ${{ needs.bump-and-tag.outputs.new_version }}
    secrets: inherit
