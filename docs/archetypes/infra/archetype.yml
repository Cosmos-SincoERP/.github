# Arquetipo: infra
# Infraestructura como código (Terraform) de un bounded context. Los .tf viven en
# /infra. No hay reusable de Terraform: el plan/apply es self-contained en el repo.
# Ver docs/archetypes/README.md.
description: "Infraestructura Terraform de un bounded context (.tf en /infra)."
stack: terraform
consumes: [reusables, dependabot]
bc_key_required: true

overrides:
  terraform_directory: /infra

# Contextos en formato `<job-caller> / <job-del-reusable>` (confirmado en PR #89).
# El `terraform plan` de pr-plan.yml es un job normal (no reusable): su contexto sería
# `plan`. Se deja fuera por ahora (requerirlo bloquea el merge si el plan tarda/falla por
# backend sin configurar); añadir `plan` aquí cuando el backend esté operativo.
required_checks:
  - "dependency-review / trivy"
  - "secret-scan / trufflehog"
