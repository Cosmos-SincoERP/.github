name: PR · terraform plan

# No hay reusable de Terraform en la plataforma: el plan/apply es self-contained.
# Corre en runner self-hosted con Managed Identity (mismo patrón que los deploys).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: [self-hosted, azure, swarm-deploy]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - name: Azure login (Managed Identity)
        run: az login --identity --output none
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color
